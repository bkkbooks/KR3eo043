front:
  text: 前序嗚呼國以民為本而民失其教或以亂天下人以食為養而飲食失宜或以害身命衛國衛生理無二致故聖人疾與戰並慎而養與教並重也中庸曰人莫不飲食也鮮能知味也夫飲食為日用之常味即日用之理勘進一層善頤生者必能善教民也教民極平易修其孝悌忠信而已頤生無元妙節其飲食而已食而不知其味已為素餐若飽食無教則近於禽獸余嘗曰子臣弟友聖人之道學也孝悌忠信王者之於城也聖賢書具在小子何敢贅焉惟飲食乃人之大欲所存易為腹負故大禹菲飲食而武候甘淡泊也今夏石米八千斤齏四十茫茫浩劫呼籲無門呂君慎庵知我將為餓殍也招遊梅涇寓廣川之不窺園無事可為無路可走悠悠長夜枵腹無聊丐得枯道人禿筆一枝畫餅思梅纂成此稿題曰飲食譜質諸知味者或不賤其養小失大而有以教我也咸豐十一年辛酉秋七月睡鄉散人書於隨息居後序嗚呼飲食譜何為而作耶蓋世味深嘗不禁有飲水思源之感也竊謂食毛踐土二百餘年歲無奇荒國無苛政竟至禽獸食人食而塗有餓殍豈非亙古未聞之奇事哉士雄年十四失怙賴先慈搘住門戶而家有七口廚無宿舂蒙父執金履思丈念舊憐孤字余曰孟英命往金華鹺業佐司會計舅氏俞公桂庭誼篤親親力肩家事贈余齋名曰潛屬潛心學問勿以內顧為憂乃未十載金丈舅氏相繼謝世余愧無以仰副二公盛意而潛修英發也徒以性情疏邁遇合多奇同郡周君光遠知我最深挈舍弟季傑另闢一業俾資事蓄而余律身極儉不善居積或以癡目之遂自號半癡逮周君作古母逝子殤世景日非益無意人間事矣乙卯冬攜眷回籍息影窮鄉賃屋而居堂名歸硯欲遂首丘之志而終老焉詎上年春省垣失事季傑幸縋城歸秋仲渟溪遭難雖不傷人而坐食無山癡將安用今旅濮院麩核充飢我生不辰兔爰興嘆華胥學步神挈希夷因易字曰夢隱並粗述四十年孤露衷情以志前路悠悠皆先人所留之餘地而後路茫茫惟有不忘溝壑耳知味者鮮且藏稿以俟之辛酉八月中旬隨息子又題
