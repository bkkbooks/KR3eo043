body:
  text: 飲食譜題辭名教於今賴主持先生洵不愧人師匡時念切成憂憤遁世情高託夢癡先生一號半癡近又更字夢隱生幸同庚憐我弱學慚無術負公知還欣兒輩叨恩庇長荷春風化雨施辛酉仲冬同邑教弟周在恩二郊精心搜輯健揮毫水始螽終特見操例似蟲魚箋爾雅體參草木注離騷養生獨抉神符祕作議翻嫌食憲勞手筆如君真傑出何當相賞醉芳醪同治元年仲夏錢塘後學吳淦菊潭飲食譜寄託至深寓意最廣欽佩欽佩壬戌季夏宜春後學袁鳳桐蓮芾讀書能明理方許為良醫良醫亦多術開卷每厥疑王君著作才手卷不停披古汲得井綆學羞傍藩籬方非祕橘泉水非飲上池觀書眼如鏡大用包無遺一伎尚如此何況民牧司政柄失舉措兵燹災黔黎東西兩浙境百萬生靈糜速將醫國法起天下瘡痍硝黃肆攻伐滌蕩其垢疵參苓兼補益漸漸生氣滋邪去正可助明辨無參差慎勿耽美疢鴆毒長亂機慎勿畏惡石苦口是良規不然飲食人人得而賤之君乃明理者纍牘亦何為意別有所在未許以管窺能事絀遊夏莫為贊一詞壬戌長夏錢塘後學張蔭矩矩卿薄俗紛紛口腹貪先生仁術砭愚憨養修精義農經補飲食源流上古參箋注書徵山海富酸鹹味各性情諳我慚未解蘭臺祕快睹新編作指南壬戌秋初餘杭姻愚弟褚維培子耘甘苦深嘗世味余閉門且著一編書青燈風雨西窗下箋疏功深午夜初寒溫物性辨分明例似嵇康論養生不識先生開卷意豳風無逸兩含情硯已無田可自鋤浪遊橐筆隱華胥嘗來雋永惟書味食字成仙脈望如先生慨硯無歸而遠遊因自號華胥小隱曩嘗自書楹聯云近人情之謂真學問知書味即是活神仙安得溪山買一區荷衣芰帶與君俱君於乙卯冬忽攜一硯歸鄉余兄仲和屢欲移家往結鄰而輒為事阻卒罹於難豈非數耶且耕且鑿忘年月靜俟河清守我愚壬戌仲秋仁和愚弟朱志成萊云此書大旨每物求其實驗不為前人臆説所惑較勝食物本草多矣夢隱以校訂見委余方避地無聊藏書已燼多病善忘雖妄附數語未必能為此書之益也壬戌閏月烏程愚弟汪曰楨謝城飲食譜採擷浩博妙能以簡約出之少陵雲讀書破萬卷下筆如有神正此之謂所列單方亦皆精妙發刊後定當風行海宇傳之無窮敬附小詩二首以識悅服之忱云烽火連天急蕭然獨隱居不勝憂世念更著活人書道可淵泉證言真菽粟如勸懲關政教仁術豈虛譽君醫案有仁術志八卷周光遠張柳吟諸君所輯萬卷充腸後名山業始成立言皆有物析理必求精世鮮能知味人當重養生一編傳刻遍利濟及環瀛壬戌季秋桐鄉愚弟陸以湉定圃一篇新著出青箱濟世仁心術更良秦客獨傳伊摯法齊候請試越人方食單安用門生議饌品先宜膳宰嘗省識延年兼卻疾底須仙府乞瓊漿壬戌嘉平烏程愚弟蔣堂海珊參天地為人人莫不飲食飲食有其經明者為之述息養憑天功長育資地力飲水當思源民以之為質谷蔬蓏介鱗詳辨須博識燥濕熱溫涼先民程以式四氣有乘除五行互生克宜臊宜膻殊用鹽用醬悉知味者鮮何用是心怵怵一篇養生論洋洋快心得著論者嵇康猶未得其詳投筆蹶然起我友琅琊王分門更別類一一提其綱窮原以竟委紹遠更搜旁始知天地間萬物無盡藏渡河竄三承逾嶺識五羊循名而責實棄短以從長東南正蹂躪避寇在窮鄉劬書劇嗜炙厥義大為彰門生食單議無奈徒倣徨韓柳唐通儒著作一代擅韓有圬者篇柳有梓人傳圬者梓人儔夫豈攑之彥韓柳不憚煩微言寓諷勸先生此書成可作韓柳論始以水開端終以寫螽殿魚子一失水寫螽極其變害稼信有然得水乃所願猶之橫暴民撫育迹亦斂遷善日不知洗心更革面許我讀終篇窺管一斑見上海乃海隅一邑也茲為蘇省會垣而江浙之竄難者率止於此地狹人稠難乎駐足夏間夢隱來遊假榻鎮海周君採山寓中會陳君春泉之女患證垂危因採山轉乞援手乃一劑得生春泉不勝感佩而夢隱瀛眷適至遂以黃歇浦西矮屋三楹為先生隨息居朋輩過從輒有題贈虛室生白人皆羡之且飲食譜一書聞歷伯符方伯已刻於鄂垣今陳君又刊於滬而重訂霍亂論諸稿同志者亦將梓以壽世爰再賦二律藉攄欽悅之懷焉一枝聊借類鷦鷯白板門間遠市囂深巷寂寥泥滑滑隔城棖觸路迢迢捲簾挹爽過朝雨倚枕無眠聽夜潮劫歷紅羊隨處息先生物外獨逍遙朝朝仰屋著書勞洛下應騰紙價高為有安排徐稚榻更兼持贈呂虔刀嗟嗟世事揉升木鬱郁人情馬齧槽縱復此心名利淡元龍意氣總能豪壬戌嘉平嘉興愚弟張保沖小尹片語移時實起豫春申浦上識君初緣深到處能驅疾心靜無為日著書壽物壽人知獨任醫民醫國有誰如沿江一折塵囂絶即是先生隨息居超然物外隱華胥撰述洋洋辨魯魚撰述各種多糾正前人之謬寓意良深托耕鑿發揮豈僅志含茹言中有物文章老先生家向懸一聯云精神到處文章老學問深時意氣平聞系稟承先訓書以自勵者家風品學即此可徵矣眼底無塵習俗除料得鐫成還示我一編快讀笑談余壬戌嘉平仁和世晚徐嗣元起庵海上重尋我友王新編著述富琳琅泉源善導皆滋養頑梗能安即秀良譜以水始以蝗終謂魚子得水可不為蝗猶莠民向化可不為盜寓意深厚獨具苦心日用尋常真學問致知格物大文章卻求韜隱無容隱一枕酣恬託夢鄉君字近改夢隱靜掩雙扉遠俗塵名言析理務推陳篋中剩有攜歸硯已刻之書十餘種劫後僅歸硯録四卷幸存指下全無不活人客臘余久患喘渴腫脹腹瀉無眠服君方三劑諸恙遂減十劑而霍然殆今之仲景也潑甕香醪剛報熟登盤早韭快嘗新時將往泰州兼承飲餞那堪驪唱匆匆別悵望天涯益愴神癸亥春王仁和世晚許之棠培之人以飲食生亦以飲食死飲食有何常死生亦偶耳昂藏七尺軀大地可小視俯仰適其適何悲復何喜藜藿與鼎鍾吾心祗如是首陽儻無稱孤竹自脫屣後車數十乘永懷子輿氏一醉方獨醒誰識其中旨狂病不可藥問君奈何爾王君丈人行狂言幸無訾耳名逾十年迹還知我否君今隱於醫我但鑽故紙不知蠹食靈聊為爵飲洗滌吾腸胃間有如水清泚今天下之病亟矣元氣耗竭而外邪益熾吾謂縱有醫國手亦將聽之天命而已然中外諸公方且徐徐焉起而圖之夫飲食之道貴以需剝極而復尚可須臾緩邪顧及是而謀所以復元氣者則亦仍求之飲食之道可矣今有病者於此原其受病之始必曰飲食不節究其養病之端亦必曰飲食必調知嚮者之受病即可知今日治病之所在夫治病於今日者培其本節其流兩言盡之矣不見夫病起者之調養得宜未幾而瘠者肥弱者強或且有倍勝於前者飲食之義大矣哉頃讀飲食譜大略已覺津津有餘味竊意此書出非僅膾炙人口將使知味者因是而洗滌腸胃含茹性情則先生噓枯起廢之功蓋不啻遍飲食之矣復製蕪詞以申讚頌天一生水人心之精仁發於知鑿通乎耕飲且食焉遊神太清道味世味辨逾淄澠淡而彌永元酒太羹觀象山雷頤貞則吉蒙養以需有孚斯實不浚其源其流乃窒天君泰然百體受職身之肥也肥家肥國癸亥孟春秀水教侄張王熙欣木從來仙佛最多情名利悠悠兩不縈一片深心惟濟世教人隨意學長生醫國醫人理本同能因物性即為功東南民力瘡痍遍也在調元贊化中餘杭姻家愚弟褚維奎星艖夢隱先生通儒也軫念民艱慨然有救世之志談窮簷疾苦懾焉失氣或扼腕而籲乃遁迹於醫性耽著書下筆數千言近鬚髯半霜雪猶竭毣毣之思撰述不倦作飲食譜自水穀至鱗介覙縷如列眉箋注簡當尤切日用雖然懸壺末伎也生人之意靡窮生人之量有限出門一望瘡痍溢目蓬蒿滿田痌瘝在抱者盍起而飲食教誨吾民哉餘杭姻家愚弟褚維厚子方膏粱非所願丹藥亦有毒造物養吾生陽飲陰食足世人味鮮知萬錢恣口腹損形兼損神酣豢病已伏參苓雖美材元氣剝難復先生懷苦心方書補未録治病在病先物性諳極熟珍奇既旁搜尤不遺寂粟味得味外味淡然自節欲固可咬菜根何妨嘗鼎肉癸亥仲春餘杭世侄郎璟子魯人生何苦縱嗜欲乃以口腹戕其身國家晏安滋耽毒降災勿謂天不仁上醫醫人先醫國能挽造化回艱迍蒸蒸元氣務培養飲和食德何其醇不然歸去壺中住杏林一枝著手春君平隱卜梅福市同作千秋高蹈人先生痌瘝夙在抱惻然疾苦念吾民針膏起廢托奢願手無斧柯徒風塵去年大疫東南遍貔貅十萬聲吟呻元年夏浙皖金陵諸營無不病奈何百戰勝精鋭竟使沉疴化碧磷今時安得起陀扁刀圭一服神乎神好為朝廷留猛士廊清海宇平黃巾又如流亡滿鄉梓垢惡所聚疵癘因老弱踣困壯者病面黧容稿衣則鶉問誰大展回春手參宇妙劑調君臣瘡庚到處盡蘇息仁民之意推親親嗚呼此願不能遂一遍靈素遙傳薪飲食之味知者鮮寓意則遠理則真可補本草條目闕可悟爾雅經注新立言本旨不在此救時藥石勞諄諄譬諸草檄愈風疾警心惕目無其倫先生之學在經世先生之書可問津願刊萬本摹萬紙獻之彤墀徵蒲輪行見陰陽調燮沴氣泯肥家肥國澤九垠秀水愚弟金福曾苕人雨後精苗數藥欄蟲魚草木見聞殫非關博物誇龍鮓豈為談經喻馬肝春野煙浮千品活秋窗葉落一燈殘別從醫案開生面莫笑豪華議食單秀水愚侄趙銘桐孫顛沛危亡際先生道不窮著書多歲月醫俗煦春風慧眼人情識靈心物理通先生論事論學總以近人情為第一義故能盡人之性以盡物之性如此也不才欣附驥小伎愧雕蟲同邑受業周開第少謙菽粟疏食生民寶上古教人有至道後世貪叨口腹恣徒自肥腸復滿腦飲食以生亦以死先生用是惄焉搗飲水思源理當然厥義於人易了了搜羅殆遍無一遺蔬蓏鱗介牲禽鳥王綱失墜政凌夷以致中原頻擾擾飲之食之失其經頤養殊乖明哲保爰知其理將毋同一編窮年閉門草飲和食德盛世氓日用為質遊皞皞及今蹂躪年復年生民塗炭思逞狡太和元氣誰為回調攝得宜細參考食之以時王政垂生養往往關億兆先生著書格物功家風志不在溫飽若論鬥石才恢恢不棄葑菲躬藐藐小子何知大度涵用敢作歌識傾倒安得人人如此仁心存同胞同與痌瘝常在抱餘杭姻愚侄褚成亮叔寅少陵每飯不忘君飲水思源至理廑千里膏腴豢豺虎上三句叔夢中與煃聯句得之醒而命煃足成一律萬般波浪痛榆枌家鄉蹂躪慘不可言旨參造化陰陽燮味倩調和鼎鼎芬譜以調和列蔬食前其意深矣春草偏成竹林句聯吟從此更殷勤等身著作鬼神驚叔未刻諸稿不止盈尺探得源頭物理精濟世不隨塵世混存心只見道心瑩生涯淡極詩書潤德澤深從忠孝成靖康之難我安化始祖忠肅王暨子錫京公同殉節敕建專祠吾叔嘗重立忠孝流芳賜額時舉此二字以訓後人歸硯咀含曾盥讀承賜讀歸硯録亦寓木本水源之意垂青小阮感衷情難後時蒙存注海鹽族侄元煃肖士復獲追隨杖履前申江重聚假天緣瘡痍遍地心愁絶鋒鏑餘生意惘然不倦折肱商舊學重訂霍亂論將次付梓重校證治針經亦已脫稿又經著手出新編切於日用斯為貴逐物推求邁昔賢汪謝城先生謂此書遠勝食物本草詢定評也湖山美地劫灰揚猶喜名山著述藏公昔居杭會嘗刊醫書十餘種版未攜歸諒遭兵燹幸諸稿皆存近聞楊素園先生將為重刻於江西且欲以溫熱經緯諸種並付剞劂樗櫟材庸慚述德歸硯録採先祖論醫一則淵源學富纘重慶公之曾大父著重慶堂隨筆公嘗刊入叢書繁徵博引偏能盡遠紹旁搜罔不藏悟得先生言外意漫天何至有飛蝗同邑姻愚侄戴其浚鶴山水飲類附淡巴菰鴉片天雨水戰國策名上池水陶隱居名半天河俗名天泉水甘涼養陽分之陰瀹茗清上焦之熱體輕味淡煮粥不稠宿久澄徹者良露水立秋後五日白露降夜來不可露身出戶故曰白露身勿露甘涼潤燥滌暑除煩若秋前之露皆自地升蘇詩露珠夜上秋禾根是已云秋禾者以禾成於秋也稻頭上露養胃生津菖蒲上露清心明目韭葉上露涼血止噎荷花上露清暑怡神菊花上露養血息風余可類推冬雪水甘寒清熱解毒殺蟲溫疫熱狂暑暍霍亂徐徐頻灌勿藥可瘳淹浸食物久藏不壞溪河湖池水各處清濁不同非清而色白味淡者不可飲凡近地無好水宜飲天泉或以其水澄清煮熟而藏之即為好水海水咸濁蒸取其露即清淡可飲井泉水甘寒清下焦之熱煮飯補陰中之陽新汲者良咸濁勿用中煤炭毒灌之即蘇食井中每年五月五日午時入整塊雄黃整塊明礬各斤許以闢蛇蟲陰濕之毒或整塊硃砂數兩尤妙食水缸中宜浸降香一二段菖蒲根養於水面亦良水不甚清者稍以礬澄之並解水毒雨雪之水皆名天泉其質最輕其味最淡杭人呼曰淡水瀹茗最良宜煎清肅滌熱諸藥惟杭人飲之故人文秀美甲於天下杭城皆瓦屋以竹木或磚或銅錫為承溜周曰承溜漢曰銅池宋曰承落皆簷溝水筧之稱也杭人呼為閣漏引其水而注諸缸然必日使人梯而上視如有鳥惡貓穢之瓦即以潔瓦易之再以淨帚頻為掃除毋使木葉塵砂之積則水始潔若近廚之屋必有煤炲之汙勿取其水也狂風暴雨必夾塵砂亦勿取焉久晴乍雨亦勿遽取恐瓦有積垢濯之未淨也既注之缸必待其澄而後挹其清者藏諸別缸藏久彌良凡藏水之缸宜身長而口小者上以缶盆冪之而置於有風無日之所日曬久則水易耗而色不白也置缸之地甃以磚石或埋入土中一二尺亦可先慈嗜茗而取水甚嚴蓄水甚精謹詳識之雖他處亦可仿行以免水土惡劣之病不但備烹茶煮藥之用已溪澗之水發源于山清甘者良水如惡劣其山必嶮巇或為砒礜毒藥之所産或為蟲蛇猛獸之所居而人之飲食首重惟水乍人其鄉者飲之疾病生焉生於其地者習之很戾鍾焉欲籌斡旋補救之策以期革獷悍之俗而康濟斯民者惟有廣鑿井泉是為亟務爰採泰西掘井法於下庶無井之地悉可仿而行焉高地作井未審泉源所在其求之法有四第一氣試當夜水氣恆上騰日出即止今欲知此地水脈安在宜掘一地窖於天明辨色時人入窖以目切地望地面有氣如煙騰騰上出者水氣也氣所出處水脈在其中第二盤試望氣之法曠野則可城邑之中室居之側氣不可見宜掘地深三尺廣長任意用銅錫盤一具清油微微遍擦之窖底用木高一二寸以搘盤偃置之盤上乾草蓋之草上土蓋之越一日開視盤底有水欲滴者其下則泉也第三缶試近陶家之處取瓶缶坯子一具如前銅盤法用之水氣沁入瓶缶者其下泉也無陶之處以土甓代之或用羊絨代之羊絨者不受濕得水氣必足見也第四火試掘地如前篝火其底煙氣上升蜿蜒曲折者是水氣所滯其下則泉也煙氣直上者否鑿井法有五第一擇地山麓為上蒙泉所出陰陽適宜園林室屋所在向陽之地次之曠野又次之山腰者居陽則太熱居陰則太寒為下此論泉水之高下等第耳然山腰山頂亦有甘泉不可泥也鑿井者察泉水之有無斟酌避就之第二量淺深井與江河地脈通貫其水淺深尺度必等今問鑿井應深幾何宜度天時旱潦河水所至酌量加深幾何而為之度去江河遠者不論不論者不論深淺而以及泉為度也泉愈深則水愈美雖水土惡劣之鄉深泉必清冽無毒也第三避震氣地中之脈條理相通有氣伏行焉強而密理中人者九竅俱塞迷悶而死俗謂之犯土者是凡山鄉高亢之地多有之澤國鮮焉此地震之所由也故曰震氣凡鑿井遇此覺有氣颯颯侵入急起避之俟泄盡更下鑿之欲候知氣盡者縋燈火下視之火不滅是氣盡也第四察泉脈凡掘井及泉視水所從來而辨其土色若赤埴土其水味惡赤埴黏土也中為甓為瓦者是若散沙土水味稍淡若黑墳土其水良黑墳者其土色黑稍黏也若沙中帶細石子者雖赤土黃土皆佳其水最良第五澄水凡作井底用木為下磚次之石次之鉛為上既作底更加細石子厚一二尺能令水清而味美試水美惡辨水高下其法有五凡江河井泉雨雪之水試法皆同第一煮試取清水置淨器煮熟傾入白瓷器中候澄清下有沙土者此水質濁也水之良者無滓又水之良者以煮物則易熟第二日試清水置白瓷器中向日下令日光正射水視日光中若有塵埃絪縕如遊氣者此水質不淨也水之良者其澄徹底第三味試水元氣也元氣無味無味者真水凡味皆從外合之故試水以淡為主味佳者次之味惡為下天泉最淡故烹茶獨勝而煮粥不稠第四稱試有各種水欲辨優劣以一器更酌而衡之輕者為上第五紙帛試用紙或絹帛之類色瑩白者以水蘸而干之無痕迹者為上於文白水為泉故水以色白為上人可以一日無谷不可以一日無水水之於人顧不重歟苟知掘井試水之法則在在可飲甘泉而免疾病且藉以備旱災御兵火一舉而數善存焉余性喜鑿井而力有未逮惟冀同志者勉為之但井欄之口宜小而多既免墜溺仍便引汲也設無水之地而萬難鑿井者更列水庫法於後水庫法泰西書云若天府金城居高乘險江湖溪澗境絶路殊鑿井百尋盈車載綆時逢亢旱涓滴如珠或絶徼孤懸恆須遠汲長圍久困人馬乏竭如此之類世多有之臨渴為謀豈有及哉計惟恆儲雨雪之水可以御窮而人情紐近未或先慮及其已至坐稿而已亦有依山掘地造作池塘以為旱備而彌月不雨已成龜坼徒傷挹注之易窮不悟滲漏之實多也西方諸國因山為城者其人積水如積穀谷防紅腐水防漏泄其為計慮亦略同之以故作為水庫率令家有三年之蓄雖遭大旱遇強敵莫我難焉且上方之水比於地中陳久之水方於新汲其蠲煩去疾益人利物往往勝之彼山城之人遇江河井泉之水猶鄙不屑嘗矣天泉宿水遠勝山泉此惟杭人知之名曰水庫者固之其下使無受泄也冪之其上使無受損也原注冪防耗損亦防不潔故古人井亦有冪也四行之性土為至干土性干故勝濕受水太過是卑濫而為濕土甚於火矣水居地中風過損焉日過損焉夏之日大旱金石流土山焦而水獨存乎妄人謂濕熱相合為暑真是夢囈故固之故冪之水庫之事有九一曰具具者所以庀其物也細砂石灰烏樟桐油等物二曰劑劑所以為之和也三曰鑿鑿所以為之容也在家在野皆可擇地而為之不論方圓宜下侈上弇為妙中底以三分之一為坎渟其垢時以吸筒吸去之則年久彌清也四曰築築所以為之地也底牆皆須築實毋使滲漏五曰塗塗所以為之固也築堅候至八分干再以烏樟或細灰塗之六曰蓋蓋所以為之冪也七曰注注所以為之積也以承溜引注也八曰挹挹所以受其用也九曰修修所以為之彌縫其闕也凡造擴造窖造鹽地皆須築實毋使滲漏其事同也而各處造法微有不同若造水庫之法亦可各隨其便者故附載其略於此智者自能因地制宜水倉法水庫或卒難集辦更有水倉一法較易從事其法創自乾隆間楊州余君觀德凡水土惡劣之鄉人煙稠密之地距河稍遠之處皆可仿行以備兵火旱災疾病諸患但置曠地一區繚以土垣前設門楹傍曰水倉中為大院置大缸數百或百十隻腳埋入土尺許滿儲以水復置水桶百十隻水龍數具外鐍以鎖設有災患開取甚易若大家巨剎凡有空院者尤易仿行為己為人公私兩益故附載之煎藥用水歌何西池醫碥云急流迅速堪通便宣吐洄瀾水即逆流水最宜百沸氣騰能取汗甘瀾勞水流水杓揚萬遍名甘瀾水亦名勞水意同之黃齏水吐痰和食霍亂陰陽水百沸天泉與新汲井水各半也可醫治瘧亦妙新汲無根皆取井除煩去熱補陰施地漿解毒兼清暑亦和中補土臘雪寒冰療疫奇更有輕靈氣化水如蒸露法蒸水以管接取用之一名氣汗水亦名水露雖海水但蒸取其露即清淡可飲以咸濁不能上升也奇功千古少人知善調升降充津液滋水清金更益脾肺熱而腎涸清金則津液下澤此氣化為水天氣下為雨也腎涸而肺熱滋陰則津液上騰此水化為氣地氣上為云也蒸水使水化為氣氣復化水有循環相生之妙而升降之機脾為之主故兼主中樞不運也乳汁甘平補血充液填精化氣生肌安神益智長筋骨利機關壯胃養脾聰耳明目本身氣血所化初生藉以長成強壯小兒周歲即宜斷乳必以穀食始可培植後天造物之功不容穿鑿故大人飲乳僅能得其滋陰養血助液濡枯補胃充肌而已設脾弱氣虛膏粱濕盛者飲之反有滑瀉釀痰減餐痞悶之虞且乳無定性乳母須擇肌膚豐白情性柔和別無暗疾不食葷濁厚味者其乳汁必醲白甘香否則清稀腥濁徒增兒病也牛馬蛇肉毒飲人乳解之牛乳甘平功同人乳而無飲食之毒七情之火善治血枯便燥反胃噎膈老年火盛者宜之水牛乳良小兒失乳者牛羊乳皆可代也馬乳甘涼功同牛乳而性涼不膩故補血潤燥之外善清膽胃之熱療咽喉口齒諸病利頭目止消渴專治青腿牙疳白馬者尤勝羊乳甘平功同牛乳專治蜘蛛咬毒白羜羊者勝酪酥醍醐牛馬羊乳所造酪上一層凝者為酥酥上如油者為醍醐並甘涼潤燥充液滋陰止渴耐飢養營清熱中虛濕盛者均忌之茶微苦微甘而涼清心神醒睡除煩涼肝膽滌熱消痰肅肺胃明目解渴不渴者勿飲以春采色青炒焙得法收藏不泄氣者良色紅者已經蒸庵失其清滌之性不能解渴易成停飲也普洱産者味重力峻善吐風痰消肉食凡暑穢痧氣腹痛乾霍亂痢疾等證初起飲之輒愈諸露凡谷菜果蓏草木花葉諸品具有水性之物皆取其新鮮及時者以法入甑蒸溜得水名之為露用得其宜遠勝諸藥何者諸藥既干且久或失本性譬用陳米作酒酒力無多若不堪久藏之物尤宜蒸露密儲如以諸藥煎作湯飲味故不全間有因煎失其本性者惟質重味厚滋補下焦如地黃枸杞之類必須煎汁也若作丸散並其渣滓啖之殊勞脾運惟峻厲猛烈之藥宜丸以緩之冰麝忌火諸香必丸而進之五苓六一等劑須散以行之凡人飲食蓋有三化一曰火化烹煮熟爛二曰口化細嚼緩咽三曰胃化蒸變傳運二化得力不勞於胃故食生冷大嚼急咽則胃受傷也胃化既畢乃傳於脾傳脾之物悉成乳糜次乃分散達於周身其上妙者化氣歸筋其次妙者化血歸脈用能滋益精髓長養肌體調和營衛所云妙者飲食之精華也故能宣越流通無處不到所存糟粕乃下於大腸今世滋補丸劑皆干藥合成精華已耗又須受變於胃傳送於脾所沁入宣布能有幾何不過徒勞脾胃悉成糟粕下墜而已朝吞暮餌抑何愚耶汪謝城曰諸露生津解熱誠為妙品但肆中貪多而蒸之過久以致味薄或羼他物以取香如枇杷葉露亦羼香物正與嗽證相反故必以自蒸為佳又中有飲濕者諸露皆非所宜酒大寒凝海而不冰其性熱也甘苦辛酸皆不是其味異也合歡成禮祭祀宴賓皆所必需壯膽闢寒和血養氣老人所宜行藥勢劑諸肴殺鳥獸鱗介諸腥陳久者良多飲必病故子弟幼時總不令飲酒到大來不戒而自不飲矣凡民日食不過一升而尋常之量輒飲斗酒是一人之飲足供數人之食至於盛肴饌多朋從其費又不可勝計也酒之為物勤儉多妨故禁酒可以使民富貞潔之人以酒亂性力學之人以酒廢業盜賊之徒以酒結夥剛暴之徒以酒行凶凡世間敗德損行之事無不由於酒者此書之所以作酒誥漢時所以三人群飲罰金四兩也酒之為物志氣兩昏故禁酒可以興民教富之教之誠富國坊民之善術今蕞爾小邑歲費造酒之米必以萬石計不但米價日昂徑至釀成大劫此其一端也可不鑑哉解酒毒大醉不醒枳椇子煎濃汁灌人乳和熱黃酒服外以生熟湯浸其身則湯化為酒而人醒矣酒釀甘溫補氣養血助運化充痘漿多飲亦助濕熱冬制者耐久藏燒酒一名汗酒性烈火熱遇火即燃消冷積御風寒闢陰濕之邪解魚腥之氣陰虛火體切勿沾唇孕婦飲之能消胎氣汾州造者最勝凡大雨淋身及多行濕路或久浸水中皆宜飲此寒濕自解如陡患泄瀉而小溲清者亦寒濕病也飲之即愈風寒入腦久患頭痛及飲停寒積脘腹久疼或寒濕久痹四肢痠痛諸藥不效者以滴花燒酒頻摩患處自愈若三伏時將酒曬熱拓患處效更捷素患凍瘃者亦於三伏時曬酒塗患處至冬不作矣霍亂轉筋而肢冷者以燒酒摩拓患處效解燒酒毒蘆蔔汁青蔗漿隨灌緑豆研水灌或以枳椇子煎濃湯灌大醉不醒急以熱豆腐遍體貼之冷即易以醒為度外用井水浸其發並用故帛浸濕貼於胸膈仍細細灌之至蘇為度凡燒酒醉後吸煙則酒焰內燃而死又有醉後內火如焚而反惡寒者厚覆衣被亦能致死即口渴飲冷止宜細細飲之以引毒火外達若連飲過多熱毒反為驟冷所遏無由外達亦多閉伏不救也愈風酒方陳海虴漂淨拭乾晾極燥十二兩黑大豆嫩桑枝松針杵爛各四兩陳酒七斤封浸煮三炷香喇嘛酒方治半身不遂風痹麻木胡桃肉龍眼肉各四兩杞子首烏熟地各一兩白朮當歸川芎牛膝杜仲白芍豨蘞草茯苓丹皮各五錢砂仁烏藥各二錢五分上十六味絹袋盛之入瓷瓶內浸醇酒五斤隔水煮濃候冷加滴花燒酒十五斤密封七日健步酒方生羊腸一具洗淨晾燥龍眼肉沙苑蒺藜隔紙微炒生苡仁淘淨曬燥仙靈脾以銅刀去邊毛真仙茅各四兩上六味用滴花燒酒二十斤浸三七日下部虛寒者宜之華亭董氏方也見三岡識略熙春酒方生豬板油一斤甘杞子龍眼肉女貞子冬至日採九蒸九曬直生地洗淨曬乾仙靈脾去邊毛生緑豆洗淨曬乾各四兩上七味滴花燒酒二十斤封浸一月茹素者去豬油加耿柿餅一斤可也此酒健步駐顏培養心腎衰年飲之甚妙但以豬脂白蜜浸之名玉液酒溫潤補肺澤肌膚美毛髮治老年久嗽極效隨息自驗固春酒方治風寒濕襲入經絡四肢痹痛不舒俗呼風氣病不論新久歷治輒效鮮嫩桑枝大豆黃卷或用黑大豆亦可生苡仁樞木子即十大功勞紅子也黑者名極木子亦可用無則用葉或用南天燭子亦可各四兩金銀花五加皮木瓜蠶砂各二兩川黃柏松子仁各一兩上十味絹袋盛而縫之以好燒酒十斤生白蜜四兩共裝壇內將口封固扎緊水鍋內蒸三炷香取起放泥地上七日即可飲矣每日量飲一二杯病淺者一二斤即愈定風酒方天冬麥冬生地熟地川芎五加皮牛膝秦艽各五錢川桂枝三錢上九味絹袋盛之以滴花燒酒二十斤淨白蜜赤沙糖陳米醋各一斤攪勻浸入瓷壇豆腐皮封口壓以巨磚安水鍋內蒸三炷香壇須寬大則蒸時酒弗溢出也取起埋土中七日此內府方也功能補血息風而健筋骨且製法甚奇凡患虛風病者飲之輒愈而藥味平和衰年頻服極有裨益並無流弊按酒性皆熱而燒酒更烈韌如羊腸潤如豬脂並能消化故不但耗穀麥亦最損人尤宜禁之然治病養老之功亦不可沒世傳藥酒率以剛燥之品助其猛烈方名雖美而遺患莫知惟此七方用藥深有精義洵屬可傳但飲貴微醺不可過恣始為合法虛寒衰老之人寒宵長夜苦難酣眠達曉宜制小銀瓶略如鼻煙壺式口用旋蓋以暖酒灌入佩於衷衣兜肚之間酒可徹夜不涼丁夜醒時飲而再睡不煩人力恬適自如補益之功甚大若能此外勿飲更可引年凡飲酒並宜隔湯燉溫也淡巴菰辛溫闢霧露穢瘴之氣舒憂思郁悶之懷殺諸蟲禦寒濕前明軍營中始吸食之漸至遍行天下不料其為鴉片煙之先兆也然聖祖最惡之而昧者猶以熙朝瑞草譽之謬矣臥房卑濕以干煙葉厚鋪席下良並可以闢臭蟲蜈蚣蛇蠍諸蟲也絞腸痧煙筒中垢如豆大一丸放病人舌下掬水灌之垂死可活蛇咬及諸毒蟲螫以煙筒中垢塗之鴉片鴉片入藥亦始前明李瀕湖本草綱目收之國朝乾隆間始有吸其煙者初則富貴人吸之不過自速其敗亡繼則貧賤皆吸之因而失業破家者衆而盜賊滿天下以口腹之欲致毒流宇內塗炭生民洵妖物也智者遠之亦有因衰病而誤墜其中者以吸之入口直行清道頃刻而遍一身壅者能宣郁者能舒陷者能舉脫者能收凡他藥不能治之病間有一吸而暫效者人不知其為劫劑遂詫以為神丹而因病吸此尤易成癮逮癮既成臟氣已與相習嗣後舊疾復作必較前更劇而煙亦不能奏效矣欲罷不能噬臍莫及乃致速死余見實多敢告世人毋蹈覆轍徐松龕曰天竺自六朝後皆稱印度今五印度為英吉利所轄進口貨物近以鴉片為主宇宙浮孽之氣乃獨鍾於佛國何其怪也戒法斷癮之方驗者甚少且用煙或煙灰者居多似乎煙可少吸一不服藥癮即如故惟此方日服仍可吸煙旬余癮自漸減又不傷身蓋物性相制此藥專治鴉片之毒故能斷癮絶無他患也方用鮮松毛數斤略杵井水熬稀膏每晨開水化服一二錢或每土一斤用松樹皮半斤煎湯熬煙如常吸食癮亦漸斷或以一味甘草熬為膏調入煙內初且少人漸以加多如常吸之斷癮極效解毒肥皂或金魚杵爛或豬屎水和絞汁灌之吐出即愈甘草煎濃汁俟涼頻灌生南瓜搗絞汁頻灌青蔗漿恣飲凡服煙而死雖身冷氣絶若體未僵硬宜安放陰處泥地一經日照即不可救撬開牙關以竹箸橫其口中頻頻灌以金汁南瓜汁甘草膏之類再以冷水在胸前摩擦仍將頭髮解散浸在冷水盆內或可漸活穀食類秈米甘平宜煮飯食補中養氣益血生津填髓充肌生人至寶量腹節受過飽傷人凡患病不飢婦人初産感證新愈並勿食之磨粉蒸糕松而不韌病人弱體可作點心飯露生津補虛療膈秈種甚多有早中晚三收赤白二色以晚收色白者良凡不種粳之處皆呼秈為粳湖州蒸谷或炒谷而藏之作飯尤香早收者性溫不耐久藏汪謝城曰凡八谷一類之中必皆有大小早晚黏不黏各種如稻為一谷其黏者為糯不黏者為粳而秈又粳之別種呼秈為粳猶呼穬為大麥未為大誤吾鄉蒸谷炒穀米用米少而得飯多不但取其香也鄭元慶湖録論之甚詳粳米亦作粳甘平宜煮粥食功與秈同秈亦可粥而糯較稠粳亦可飯而秈耐飢粥飯為世間第一補人之物強食亦能致病伐生易云節飲食論語云食無求飽尊生者能繹其義不必別求他法也惟患停飲者不宜啜粥痧脹霍亂雖米湯不可入口以其性補能閉塞隧絡也故貧人患虛證以濃米飲代參湯每收奇績若人衆之家大鍋煮粥時俟粥鍋滾起沫團醲滑如膏者名曰米油亦曰粥油撇取淡服或加煉過食鹽少許服亦可大能補液填精有裨羸老至病人産婦粥養最宜以其較秈為柔而較糯不黏也亦可磨粉作糕而嘉興人不善藏谷收米入囤蒸罨變紅名曰冬舂米精華盡去糟粕徒存暴殄天物莫此為甚炒米雖香性燥助火非中寒便瀉者忌之又有一種香粳米自然有香亦名香珠米煮粥時稍加入之香美異常尤能醒胃凡煮粥宜用井泉水則味更佳也糯米一名元米亦名占米甘溫補肺氣充胃津助痘漿暖水臟釀酒熬餳造作餅餌若煮粥飯不可頻餐以性黏滯難化也小兒病人尤當忌之凍米冬月所制性不黏滯止瀉補脾炒米香燥助火多食傷津脾虛泄瀉糯米炒黃磨粉加白沙糖調服虛寒多溺糯米飯杵為糍臥時煮熱細嚼食之諸米泔第二次者清而可用清熱止煩渴諸禾稈甘溫煎汁飲治寒濕發黃停食腹脹消牛肉積作薦禦寒暖於棉絮挼穰籍靴鞋暖足去濕燒灰淋汁冷服解砒毒飴稀者為飴乾者為餳諸米皆可熬以糯米熬者為勝甘溫補中益氣養血能助濕熱動火生痰凡中滿吐逆疸瘧疳膨便閉牙痛水腫目赤等證皆忌之魚臍疔瘭疽瘑瘡並用飴糖塗稻芒魚骨鯁喉及誤吞竹木錢叉中天雄附子草烏毒並宜頻食飴糖解銀黝毒日用飴糖四兩作小丸不時以麻油吞下須服過百日外方無慮火燒成瘡餳糖燒灰傅粟米色有青黃粒有粗細種類不一亦名粱俗呼小米功用與秈粳二米略同而性較涼病人食之為宜糯者亦名秫汪謝城曰粱之黏者固可稱秫而實非治不寐之秫黍米北人呼為黃米以其色黃也然亦有赤者功與秈似厥性較溫南方所無也稷米一名高粱俗呼蘆穄甘涼清胃補氣養脾糯者名秫治陽盛陰虛夜不得寐及食鵝鴨成癥凡黍稷粟之糯者皆可釀酒造餳而南方稷米但有不黏者耳汪謝城曰前人本草分別多誤惟程氏九穀考所辨為是本草綱目以黏不黏分黍稷是分一谷為二谷也小麥面甘溫補虛乏實皮膚厚腸胃強筋力北産重羅者良造為挂麵可以致遠病人食之甚宜南方地卑麥性黏滯能助濕熱時感及瘧痢疳疸腫脹腳氣痞滿痧脹肝胃痛諸病並忌之新麥尤甚惟單酵水造為蒸餅較不助病且可入藥跌打挫朒白麵同梔子搗勻水調塗遠行腳研成疱白麵水調塗大衄血出飛羅面入鹽少許冷水調服三錢大便久瀉飛羅麵炒熟每晨加白砂糖或炒鹽調服麩麥皮也凡患身體疼痛及瘡瘍潰爛沾漬或小兒暑月出痘潰爛不能著席者並用夾褥裝麩藉臥性涼而軟洵妙法也麵筋麩入水中洗揉而成性涼解熱止渴消煩勞熱人宜煮食之但不易化須細嚼之誤吞錢者以麵筋放瓦上炙存性研末開水調服在喉者即吐出入腹者從大便下麥粉麩洗面筋澄出之漿濾幹成粉俗呼小粉甘涼可為粢餌素食漿衣之用陳久者炒焦以醋熬成膏治一切癰瘍湯火傷大麥一名牟麥一名穬麥種類不一方土不同今人罕食藥肆以造麥糵金華人以之飼豬故其肉最佳而造為蘭熏甲於天下也汪謝城曰麥為小麥牟為大麥穬麥一名辵𦵺麥則大麥之別種南方無牟即呼穬為大麥實則同類而異種也大麥須有消腫之功穬麥須亦可用荍麥亦作蕎俗名烏麥甘溫羅面煮食開胃寬腸益氣力御風寒煉滓穢磨積滯與蘆蔔同食良以性有微毒而發痼疾蘆蔔能制之也而易長易收尤為救荒極品各處皆宜廣種為是另有一種味苦者雖不堪食亦可濟荒小兒丹毒熱瘡荍麥面醋調塗白濁白帶脾積久瀉休息痢並宜食此面痢疾炒熟荍麥二錢砂糖湯調下絞腸痧痛荍麥炒焦開水調服湯火傷荍麵炒黃水和傅玉蜀黍一名玉高粱俗名苞蘆又名紆粟又名六穀嫩時採得去苞須煮食味甚甜美老則粒堅如石舂磨為糧亦為救荒要物但粗糲性燥食宜半飽庶易消化至東牆穇子各種雜糧及黃精玉竹之類並可充飢作食造酒濟荒茲不備載苡米甘平健脾益胃補肺緩肝清熱息風殺蟲勝濕故治筋急拘攣風濕痿痹水腫消渴肺痿吐膿咳嗽血溢肺胃腸癰疝氣五淋乾溼腳氣便瀉霍亂黃疸蛔蟲諸病並煮湯飲亦可蒸食煮粥煮飯無不宜之脾約便艱不宜多食性專達下孕婦忌之黑大豆甘平補脾腎行水調營祛風邪善解諸毒性滯壅氣小兒不宜多食服厚朴者忌之服萆麻子者犯之必死小者名穭豆品較下僅堪餵馬故名馬料豆俗謂功勝黑大豆殊失考也辟穀救荒黑豆淘淨蒸極透曬乾如是三次九次更妙磨細末柿餅煮爛去蒂核與豆末等分搗丸雞子大每細嚼一丸津液咽下勿用湯水可終日不飢遠行攜帶甚便且可任吃諸物略無所忌又能滋補脾腎而治噎食便瀉等病闢疫稀痘解諸藥毒黑大豆二合甘草一錢煎汁頻飲黑大豆皮入藥止盜汗大豆黃卷即黑大豆為糵也治濕痹筋攣膝痛消水病脹滿非表散藥也黃大豆甘平補中解毒宜煮食炒食則壅氣浸罨發芽摘根為蔬味最鮮美肺癰痧氣生嚼不腥疑似之間試之甚驗痘後癰毒嚼生黃豆塗之即潰浸胖搗塗諸癰瘡亦妙青大豆甘平補肝養胃嫩時剝而為肴味極鮮美鹽水煮而烘之可以久藏致遠諸豆有早中晚三收以晚收粒大者良並可作腐造醬榨油惟青豆性較軟更為食品所宜莢闊粒扁者尤佳兵荒救飢豆青黃隨用七斗芝麻黑白不拘三斗並淘淨即蒸蒸過即曬曬乾去殼再蒸再曬凡三次搗極熟丸胡桃大每細嚼一丸津液咽下可三日不飢諸無所忌所費不多一料可濟萬人白豆豆具五色功用略同惟白者夏熟早收故粒小而性溫能發病也赤豆甘平補心脾行水消腫化毒排膿多食耗液蛇咬者百日內忌之以緊小而赤黯色者入藥其稍大而鮮紅淡紅色者止為食用故本草以赤小豆名之後人以廣産木本半紅半黑之相思子亦有紅豆之名遂致誤用亦猶黑大豆有緊小為雄一言而昧者訛為馬料豆也水腫腳氣赤小豆一斗煮極爛取汁五升溫漬足膝兼食小豆勿雜食水鼓腹大動搖有聲皮膚黑者赤小豆三升白茅根一握水煮食豆以消為度乳汁不通赤小豆煮汁飲或煮粥食諸般癰毒赤小豆生研入苧根杵勻雞子清調傅丹毒如火赤小豆末雞子清稀調塗之緑豆甘涼煮食清膽養胃解暑止渴潤皮膚消浮腫利小便已瀉痢析酲弭疫浸罨發芽摘根為蔬味極清美生研絞汁服解一切草木金石諸藥牛馬肉毒或急火煎清湯冷飲亦可緑豆皮入藥清風熱去目翳化斑疹消腫脹緑豆粉宜作糕餌素饌食之清積熱解酒食諸毒新汲水調服治霍亂轉筋解砒石野菌燒酒及諸藥毒暑月痱瘡緑豆粉滑石和勻撲打撲損傷緑豆粉炒紫色新汲水調傅以杉木皮縛定杖瘡疼痛緑豆粉炒研雞子清和塗一切癰腫初起緑豆粉炒黃黑色牙皂一兩同研米醋調傅皮破者油調之外腎生瘡緑豆粉蚓糞等分研塗之蠶豆以其熟於蠶時故名蠶豆一名佛豆甘平嫩時剝為蔬饌味甚鮮美老則煮食可以代糧炒食可以為肴性主健脾快胃浸以發芽更不壅滯亦可煮糜作糕餌肆中磨細攙入小粉亦可燙皮搓索以混緑豆粉豌豆粒圓如珠爾雅名戎菽管子作荏菽本草名胡豆唐史作畢豆遼志作回回豆俗呼淮豆亦曰寒豆甘平煮食和中生津止渴下氣通乳消脹研末塗癰腫擦面去皯𪒟亦可作醬用豇豆甘平嫩時採莢為蔬可葷可素老則收子充食宜餡宜糕頗肖腎形或有微補扁豆甘平嫩莢亦可為蔬子以白者為勝去皮煮食補肺開胃下氣止嘔清暑生津安胎去濕治帶濁時痢解魚酒藥毒炒熟則溫健脾止瀉患瘧者忌之赤白帶下白扁豆為末米飲下每服二錢毒藥傷胎腹痛口噤手強頭低自汗似乎中風九死一生人多不識若作風治必死無疑生白扁豆末米飲服方寸匕或濃煎汁亦可亦解輕粉毒宜冷飲霍亂轉筋生白扁豆末冷水和少入醋服或以藤葉搗汁服砒石諸鳥獸肉毒生白扁豆末冷水和服扁豆花治痢疾崩帶解諸藥毒刀豆嫩莢可醬以為蔬蜜以為果子老入藥甘平下氣溫中止噦薯蕷一名山藥甘平煮食補脾腎調二便強筋骨豐肌體闢霧露清虛熱既可充糧亦堪入饌不勞灌溉廣種為宜子名零餘子功用相同腫脹氣滯諸病均忌噤口痢山藥半生半炒研末米飲下二錢諸腫毒山藥搗爛塗即散甘薯一名番薯一名地瓜亦名山薯甘溫煮食補脾胃益氣力御風寒益顏色種類不一以皮赤無筋味純甘者良亦可生啖凡渡海注船者不論生熟食少許即安磽瘠之地種亦蕃滋不勞培壅大可救飢切而蒸曬久藏不壞切碎同米煮粥食味美益人惟性大補凡時疫瘧痢腫脹便祕等證皆忌之調和類胡麻一名脂麻俗名油麻甘平補五內填髓腦長肌肉充胃津明目息風催生化毒大便滑瀉者勿食有黑白二種白者多脂相傳謂漢時自大宛來故名胡麻生熟皆可食為肴為餌榨油並良而不堪作飯本草列為八谷之麻誤矣古人救飢用火麻即本經之大麻殆即八谷之麻也小兒初生嚼生脂麻綿包與䃋最下胎毒頻䃋可稀痘婦人乳少脂麻炒研入鹽少許食之此方可作小菜杭人呼為脂麻鹽余最喜之且可治口臭孕婦乳母尤宜常食甚益小兒也腰腳疼痛新脂麻炒香杵末日服合許溫酒蜜湯任下以愈為度溺血脂麻杵末東流水浸一宿平旦絞汁煎沸服頭面諸瘡婦人乳瘡陰瘡生脂麻嚼爛傅谷賊稻芒阻喉也脂麻炒研白湯下湯火傷諸蟲咬傷脂麻生研塗麻醬脂麻炒如法磨為稀糊入鹽少許以冷清茶攪之則漸稠名對茶麻醬香能醒胃潤可澤枯羸老孕婦乳媼嬰兒臟躁瘡家及茹素者藉以滋濡化毒不僅為肴中美味也脂麻油甘涼潤燥補液息風解毒殺蟲消諸瘡腫烹調肴饌葷素咸宜諸油惟此可以生食故為日用所珍且與諸病無忌惟大便滑瀉者禁之凡方書所載香油即麻油也久藏泄氣則香味全失故須隨制隨用渣亦香甘可為食料筍得之而味美質軟故麻渣不可以壅竹漏胎難産因血液乾澀也麻油白蜜各一兩同煎數十沸溫服小兒丹毒湯火灼傷生麻油塗浸並飲之小兒發熱不拘風寒飲食時行痘疹並宜用之以蔥涎入麻油內手指蘸油摩擦小兒五心頭面項背諸處輒愈蠱毒及砒石河豚毒多飲生麻油即吐出腫毒初起麻油煎蔥黑色趁熱通手旋塗自消雖大毒初起若內服一二斤毒氣自不內攻也猘犬毒蛇咬者亦宜先飲生麻油一二盞良打撲傷腫麻油熬熟和醇酒服以火燒地令熱俾臥之立愈無痕茶油甘涼潤燥清熱息風解毒殺蟲上利頭目烹調肴饌日用所宜蒸熟用之澤發生光諸油惟此最為輕清故諸病不忌燃燈最亮而不損目澤發不䐈其渣浣衣去垢豈他油之濁膩可匹哉豆油甘辛溫潤燥解毒殺蟲熬熟可入烹炮雖穀食之精華而肥膩已甚盛京來者清徹獨優燃燈甚亮菜油甘辛溫潤燥殺蟲散火丹消腫毒熬熟可入烹炮凡時感痧脹目疾喉證咳血瘡瘍痧痘瘧疾産後並忌之以有微毒而能發風動疾也世俗以其氣香而尚之罔知其弊以致疾病纏綿而不察惟外用塗湯火傷刮痧調瘡藥皆妙肆中或以花生蘇子等油羼之鹽咸涼補腎引火下行潤燥祛風清熱滲濕明目殺蟲專治腳氣和羹醃物民食所需宿久滷盡色白而味帶甘者良擦牙固齒洗目去翳點蒂鍾墜傅蛇蟲螫吐乾霍亂尉諸脹痛霍亂轉筋鹽滷摩拓患處或以裹腳布浸滷束之並治諸般腳氣無滷用極鹹鹽湯亦可凡無病人濯足湯中常加鹽滷永無腳疾豉俗呼豆豉鹹平和胃解魚腥毒不僅為素肴佳味也金華造者勝淡豉入藥和中治溫熱諸病醬純以白麵造者鹹甘而平調饌最勝豆醬以金華蘭溪造者佳鹹平篘油則豆醬為宜日曬三伏晴則夜露深秋第一篘者勝名秋油即母油調和食味葷素皆宜痘痂新脫時食之則瘢黑嘉興造者鹹寒以少日曬之功也油亦質薄味淡不耐久藏猘犬咬及湯火傷未成瘡者以醬塗之中砒毒豆醬調水服胎氣上衝及虛逆嘔吐好醬油開水調服亦解鴉片毒醋酸溫開胃養肝強筋暖骨醒酒消食下氣辟邪解魚蟹鱗介諸毒陳久而味厚氣香者良性主收斂風寒咳嗽外感瘧痢初病皆忌續文獻曰獅子日食醋酪各一瓶故俗謂獅吼為吃醋云産後血運熱病神昏驚恐魂飛客忤中惡並用鐵器燒紅更迭淬醋中就病人之鼻以熏之湯火傷醋淋洗諸腫毒醋調大黃末塗糟甘辛溫醒脾消食調臟腑除冷氣殺魚腥毒以杭紹白糯米所造不榨酒而極香者勝拌鹽糟藏諸食物味皆美嫩惟發風動疾痧痘産後咽喉目疾血證瘡瘧均忌之以糟入油料製為糟油調饌香美然亦發疾非病人所宜撲損打傷及蛇蟲蜂螫酒糟罨蜜蜜者密也味甘質潤而性主固密護內故能補中益氣養液安神潤肺和營殺蟲解毒生者涼熟者平以色白起沙而作梨花香者為勝煉法以器盛置重湯中煮一日候滴水不散為熟蜜或以蜜一斤入水四兩放砂石器內桑柴火慢熬掠去浮沫至滴水成珠亦可但經火煉其性溫也若果餌肴饌漬製得宜味皆甘美洵神品哉忌同蔥食痰濕內盛脹滿嘔吐者亦忌以之丸藥須察其宜顢頇濫用焉能濟事哉湯火熱油傷蜜塗産後口渴煉蜜調白湯服川椒一名蜀椒一名巴椒一名漢椒辛熱溫中下氣暖腎祛寒開胃殺蟲除濕止瀉滌穢舒郁消食辟邪制魚腥陰冷諸物毒闢蠅蚋蜈蚣蚊蟻等蟲多食動火墮胎陰虛內熱者忌之閉口者殺人中其毒者冷水解之漆瘡作癢川椒煎湯洗凡入漆所嚼川椒塗鼻中不患漆瘡並闢疫穢邪氣婦人禿鬢川椒四兩酒浸密室內日日塗之花椒本名秦椒一名檓辛溫調中下氣除濕殺蟲止痛行瘀解魚腥毒胡椒辛溫溫中除濕化冷積止冷痛去寒痰已寒瀉殺一切魚肉鱉菌陰冷食毒色白者勝多食動火爍液耗氣傷陰破血墮胎發瘡損目故孕婦及陰虛內熱血證痔患或有咽喉口齒目疾者皆忌之緑豆能制其毒發散寒邪胡椒丁香各七粒碾碎以蔥白杵膏和塗兩手心合掌握定夾於大腿內側溫覆取汗蜈蚣咬嚼胡椒封辣茄一名榝一名鎚亦名越椒俗名辣子亦曰辣椒辣虎辣枚子各處土名不一其實即古人重九所佩之食茱萸也辛苦熱溫中燥濕御風寒殺腥消食開血閉快大腸種類不一先青後赤人多嗜之往往致疾陰虛內熱尤宜禁食丁香辛溫暖胃去濕散寒辟惡殺蟲消痞解穢已冷利止冷痛療虛噦補虛陽制酒肉魚蟹瓜果諸毒古人噙之奏事治口臭也陰虛內熱人忌之闢穢丁香一兩為末川椒六十粒和之絹囊盛佩過食蟹蚌瓜果致病丁香末五分薑湯下乳頭裂破丁香末傅並治癰疽惡肉外以膏藥護之陰冷母丁香為末紗裹如指大納入反胃母丁香一兩為末鹽梅肉搗丸芡子大每噙一丸胃寒吐瀉母丁香橘紅等分研蜜丸豆大米湯下一丸桂皮辛溫暖胃下氣和營燥濕去風殺蟲止痛制鳥獸鱗介瓜果諸毒血虛內熱溫暑時邪諸病均忌桂花辛溫闢臭醒胃化痰蒸露浸酒鹽漬糖收造點作餡味皆香美悅口亦可蒸茶油澤發松花花上黃粉及時拂取和白沙糖作糕餌食之甚美亦可釀酒主養血息風多食亦能助熱單服治瀉痢隨證以湯調椿芽香椿嫩葉也甘辛溫祛風解毒入饌甚香亦可瀹熟醃焙為脯耐久藏多食壅氣動風有宿疾者勿食玫瑰花甘辛溫調中活血舒鬱結闢穢和肝蒸露熏茶糖收作餡浸油澤發烘粉悅顏釀酒亦佳可消乳癖茉莉花辛甘溫和中下氣闢穢濁治下痢腹痛熏茶蒸露入藥皆宜珍珠蘭更勝甜菊花甘涼清利頭目養血息風消疔腫點茶蒸露釀酒皆佳苦者勿用余如野薔薇金銀花功用略同可類推也久患頭風或目疾時作甘菊花去蒂裝枕用疔腫垂死甘菊花一握搗汁飲冬月取根用女人陰腫甘菊苗杵爛煎湯先熏後洗薄荷葉辛甘苦溫散風熱清利頭目咽喉口齒諸病和中下氣消食化痰開音聲舒郁悶闢穢惡邪氣療霍亂癧瘡釀酒蒸糕熬糖造露均妙惟虛弱多汗者忌之鼻衄薄荷葉塞血痢薄荷葉煎服蛇蜂貓傷薄荷葉絞汁塗汪謝城曰薄荷多服耗散真氣致生百病余嘗親受其纍不可不知如浸火酒拌水煙人多嗜之實陰受其害而不覺耳紫蘇葉辛甘溫下氣安胎活血定痛和中開胃止嗽消痰化食散風寒治霍亂腳氣制一切魚肉蝦蟹毒氣弱多汗脾虛易瀉者忌食乾霍亂紫蘇煎服並治蛇咬及中蟹毒乳癰腫痛紫蘇湯頻飲渣滓封患處金瘡跌打出血紫蘇杵爛傅並治猘犬咬茴香辛甘溫調中開胃止痛散寒治霍亂蛇傷㿗疝腳氣殺蟲闢穢肴饌所宜制魚肉腥臊冷滯諸毒小便頻數而色清不渴者茴香淘淨鹽炒研末炙糯米糕蘸食蒔蘿一名小茴辛甘溫開胃健脾散寒止痛殺蟲消食調氣止嘔定腰齒之疼解魚肉之毒蔬食類蔥辛甘平利肺能陽散癰腫祛風達表安胎止痛通乳和營主霍亂轉筋奔豚腳氣調二便殺諸蟲理跌撲金瘡制魚肉諸毒四季不調味辛帶甘而不臭者良氣虛易汗者不可單食又忌同蜜食胎動下血蔥白煎濃汁飲未死即安已死即下未效再飲中惡卒死急取蔥心黃刺入鼻中男左女右入七八寸血出即愈並以蔥刺入耳中五寸亦治自縊垂死小兒無故卒死以蔥白納入下部及兩鼻孔內氣通或嚏即生小兒盤腸內釣腹痛以蔥湯洗兒腹仍搗蔥貼臍上良久溺出痛止小便閉脹蔥白三斤銼炒帕包二個更互尉小腹陰囊腫痛煨蔥入鹽杵爛塗赤白痢蔥白一握細切和米煮粥日日食之一切腫毒蔥白杵爛和蜜塗並治跌打杖傷金瘡挫朒流注走痛筋骨痹疼腦破血流癰毒初起均宜厚傅可取立效乳癰初起蔥白煮汁飲並解金銀毒韭辛甘溫暖胃補腎下氣調營主胸腹腰膝諸疼治噎膈經産諸證理打撲傷損療蛇狗蟲傷秋初韭花亦堪供饌韭以肥嫩為勝春初早韭尤佳多食昏神目證瘧疾瘡家痧痘後均忌産後血運切韭安瓶中沃以熱醋令氣入鼻中産後怒哭傷肝嘔青緑水韭汁入薑汁少許和服卒然中惡韭汁注鼻中漏脯郁肉諸食物毒韭汁灌之薤辛溫散結定痛寬胸止帶安胎活血治痢多食發熱忌與韭同奔豚氣痛搗薤汁服赤白痢産後痢小兒疳痢薤白和米煮粥食湯火傷薤白和蜜杵塗蒜今名小蒜俗曰夏蒜相傳此為中國之蒜辛溫下氣止痛殺蟲發風損目病後忌之葫今名大蒜漢時自西域來生辛熱熟甘溫除寒濕闢陰邪下氣暖中消穀化肉破惡血攻冷積治暴瀉腹痛通關格便祕闢穢解毒消痞殺蟲外灸癰疽行水止衄制腥臊鱗介諸毒入藥以獨子者良昏目損神不宜多食陰虛內熱胎産痧痘時病瘡瘧血證目疾口齒喉舌諸患咸忌之子苗皆可鹽藏葉亦可茹性味相似干濕霍亂轉筋噤口痢鼻淵鼻衄不止並搗蒜貼湧泉穴水腫溺閉大蒜田螺車前子等分杵攤臍中喉痹腫痛諸物鯁喉並以大蒜塞鼻中陰疽陰毒以蒜片安瘡頂艾炷灸之蛇蠍蜈蚣咬杵蒜封之心腹冷痛虛寒瀉痢陳年醋浸大蒜食數顆蕓薹辛滑甘溫烹食可口散血消腫破結通腸子可榨油故一名油菜形似菘而本削莖狹葉鋭俗呼青菜以色較深也發風動氣凡患腰腳口齒諸病及産後痧痘瘡家錮疾目證時感皆忌之遊風丹毒婦人乳吹並以油菜搗敷兼可煎洗諸瘡芫荽本名胡荽辛溫散寒辟邪解穢殺蟲止痛下氣通腸殺魚腥發痘疹多食損目凡病忌之子性味略同上七品二氏以為葷菜謂其損性靈也痘證不達胡荽二兩切碎以酒二大盞煎沸沃之蓋定勿令泄氣候冷去滓微微含噴從項背至足令遍勿噀頭面按直指方云痘症不快用此噴之以辟惡氣床帳上下左右皆宜挂之以御天癸淫佚寒濕諸氣一應穢惡所不可無然惟兒體虛寒天時陰冷噴之故妙若兒壯實及春夏晴暖陽氣發越之時用之助虐以火益火胃中熱熾毒血聚蓄則必變黑陷也不可不慎今人治痘疹不辨證之寒熱時之冷暖輒用芫荽子入藥者誤人多矣芥辛甘而溫御風濕根味尤美補元陽利肺豁痰和中通竅醃食更勝開胃性平以冬收細葉無毛青翠而嫩者良一名雪裡蕻晴日刈之晾至乾癟洗淨每百斤以燥鹽五斤壓實醃之數日後松缸一伏時俾滷得浸漬如滷少泡鹽湯候冷加入仍壓實一月後開缸分裝壇甕逐壇均以滷灌滿浸為法設滷不敷仍以冷鹽湯加之緊封壇口久食不壞生熟皆宜可為常饌若將醃透之菜于晴燥時一日曬極干密裝干潔壇內陳久愈佳香能開胃最益病人用時切食葷素皆宜以之燒肉雖盛暑不壞或切碎醃裝小壇毋庸滷浸但須築實密封尤堪藏久醃芥滷煮食物味甚鮮美若壇盛埋土中久則清徹如水為肺癰喉證神藥春芥發風動氣亦可醃食病人忌之白芥子研末水調如糊以紙密封半時可作食料辛熱爽胃殺魚腥生冷之毒多食動火內熱者忌之入藥治痰在脅下及皮裡膜外者菘一名白菜以其莖色白也亦有帶青色者然本豐莖闊迥非油菜甘平養胃解渴生津葷素咸宜蔬中美品種類不一冬末最佳醃食曬乾並如上法諸病不忌喻氏嘗曰白飯青蔬養生妙法肉食者鄙何可與言鮮者滑腸不可冷食黃矮菜一作黃芽菜甘平養胃葷素皆宜雪後更佳但宜鮮食北産更美味勝珍羞亦可為菹諸病不忌蕪菁即蔓菁一名九英菘一名諸葛菜一種根如蘆蔔者名大頭菜向産北地今嘉興亦種之醃食鹹甘下氣開胃析酲消食葷素皆宜肥嫩者勝諸病無忌其子入藥明目養肝蘆蔔俗名蘿蔔生者辛甘涼有去皮即不辛者有皮味亦不辛生啖勝於梨者特少耳潤肺化痰祛風滌熱治肺痿吐衄咳嗽失音塗打撲湯火傷救煙燻欲死噤口毒痢二便不通痰中類風咽喉諸病解酒毒煤毒並搗汁飲面毒一名來服言來牟之所服也俗作萊蔔茄子毒消豆腐積殺魚腥氣熟者甘溫下氣和中補脾運食生津液御風寒肥健人已帶濁澤胎養血百病皆宜四季有之可充糧食故膳夫經云貧窶之家與鹽飯偕行號為三白不僅為蔬中聖品已種類甚多以堅實無筋皮光肉脆者勝葷肴素饌無不宜之亦可醃曬作臘醬製為脯守山糧用堅實蘆蔔不拘白赤洗淨蒸熟俟半乾搗爛再以糯米舂白浸透蒸飯搗如糊二物等分合杵勻泥竹壁上待其自干愈久愈堅不蛀不爛如遇兵荒鑿下掌大一塊可煮成稀粥一大鍋食之耐飢或做成土坯式砌牆亦可有心有力者不可不知之反胃噎食沙石諸淋噤口痢疾腸風下血蜜炙蘆蔔細嚼任意食之肺痿咳血蘆蔔和羊肉或鯽魚頻煮食消渴蘆蔔煮豬肉頻食或搗汁和米煮粥食亦可渾身浮腫及濕熱腹脹出了子蘆蔔名地骷髏煎濃飲葉辛苦瀹過可鮮茹可醃食可曬乾久藏或生菜挂干俟蘆蔔罷時洗淨浸去苦味切碎和米煮飯儉鄉雖有年亦爾不僅為救荒之食也若於立冬日採而露之任其雨淋日曬雪壓風吹至立春前一日入甕封藏如不燥透收懸屋內俟極干入甕凡一切喉證時行瘟疫斑疹瘧痢水土不服飲食停滯痞滿疳疸脹瀉腳氣痧毒諸病洗淨濃煎服之並效子入藥治痰嗽齁喘氣鼓頭風溺閉及誤服補劑胡蘆蔔皮肉皆紅亦名紅蘆蔔然有皮肉皆黃者辛甘溫下氣寬腸氣微燥雖可充食別無功用羊角菜苦辛甘溫下氣病人忌食能動風也煎湯可洗痔瘡搗罨風濕痹痛菠薐亦名菠菜甘辛溫開胸膈通腸胃潤燥活血大便澀滯及患痔人宜食之根味尤美秋種者良驚蟄後不宜食病人忌之菾菜亦名甜菜甘苦涼清火祛風殺蟲解毒滌垢濁稀痘瘡止帶調經通淋治痢婦人小兒尤宜食之老者良先用清水煮去苦味其湯浣衣最去油垢然後再煮食之或云即古之葵菜也莧甘涼補氣清熱明目滑胎利大小腸種類不一以肥而柔嫩者良痧脹滑瀉者忌之尤忌與鱉同食蛇蜂蜈蚣螫搗莧汁服渣敷患處徐靈胎云嘗見一人頭風痛甚兩目皆盲遍求良醫不效有鄉人教用十字路口及人家屋腳邊野莧菜煎湯注壺內塞住壺嘴以雙目就壺熏之日漸見光竟得復明愚按本草莧通九竅其實主青盲明目而莧字從見益嘆古聖取義之精同蒿一名蓬蒿亦呼蒿菜甘辛涼清心養胃利腑化痰葷素咸定大葉者勝芹甘涼清胃滌熱祛風利口齒咽喉頭目治崩帶淋濁諸黃白嫩者良煮勿太熟旱芹味遜性味略同薺甘平明目養胃和肝治痢闢蟲病人可食薑辛熱散風寒溫中去痰濕止嘔定痛消脹殺蟲治陰冷諸疴殺鳥獸鱗介穢惡之毒可醬漬可糖醃多食久食耗液傷營病非風寒外感寒濕內蓄而內熱陰虛目疾喉患血證瘡瘍嘔瀉有火暑熱時瘧熱哮火喘胎産痧脹及時病後痧痘後均忌之閃拗手足跌打損傷生薑蔥白杵爛和麵炒熱罨初伏日以生薑穿線令女子貼身佩之年久愈佳治虛陽欲脫之證甚妙名女佩薑萵苣微辛微苦微寒微毒通經脈利二便析酲消食殺蟲蛇毒可醃為脯病人忌之莖葉性同薑汁能制其毒苦菜本名荼一名苦苣亦名苦蕒北人甚珍之苦寒清熱明目補心涼血除黃殺蟲解暑療淋痔愈疔癰入饌先瀹去苦味盛暑以之煨肉猶凝故脾胃虛寒者忌之不可共蜜食或云蠶婦亦不宜食血淋溺血苦蕒一把酒水各半煎服諸疔搗苦蕒汁塗能拔根或預採青苗陰乾研末水調傅亦妙蒲公英一名黃花地丁甘平清肺利膈化痰散結消癰養陰涼血舒筋固齒通乳益精嫩可為蔬老則入藥洵為上品今人但以治乳患抑何陋耶別有紫花地丁一名如意草甘涼清熱補虛消癰涼血耐飢益氣為救荒仙草以生嚼無草氣故可同諸草木葉咀食充飢也萱萼干而為菹名黃花菜一名金針菜甘平利膈清熱養心解憂釋忿醒酒除黃葷素宜之與病無忌馬蘭甘辛涼清血熱析酲解毒療痔殺蟲嫩者可茹可菹可餡蔬中佳品諸病可餐蒲蒻即香蒲根詩云其蔌維何維筍及蒲是矣甘涼清熱養血消癰明目利咽喉堅牙通二便其花中蕊屑名蒲黃細若金粉當欲開時便取之可密收作果食入藥涼血消瘀炒黑又專止血為喉舌諸血證妙品按草木嫩時可茹者在在有之惟各處好尚不同名謂不一因限於篇幅繁不勝搜姑譜一二如上以例其餘蓴一作篿甘涼柔滑吳越名蔬下氣止嘔逐水治疸柔嫩者勝時病忌之一切癰疽蓴菜搗傅未成即消已成毒即散海帶鹹甘涼軟堅散結行水化濕故內而痰飲帶濁疳脹疝瘕水腫奔豚黃疸腳氣外而癭瘤瘰癧癰腫瘻瘡並能治之解煤火毒析酲消食葷素僉宜短細者良海藻昆布粗不中食入藥功同紫菜甘涼和血養心清煩滌熱治不寐利咽喉除腳氣癭瘤主時行瀉痢析酲開胃淡乾者良石華甘鹹寒滑專清上焦客熱久食愈痔而能發下部虛寒盛夏煎之化成膠凍寒凝已甚中虛無火者忌食粗者名麒麟菜性味略同海粉甘涼清膽熱去濕化頑痰消癭瘤愈瘰癧髮菜本名龍鬚菜與海粉相同而功遜之苔菜咸涼清膽消瘰癧癭瘤泄脹化痰治水土不服木耳甘平補氣耐飢活血治跌撲傷凡崩淋血痢痔患腸風常食可瘳色白者勝煮宜極爛葷素皆佳香菌甘平開胃治溲濁不禁包邊圓嫩者佳俗名香菰痧痘後産後病後忌之性能動風故也蘑菰甘涼味極鮮美葷素皆宜開胃化痰嫩而無砂者勝多食發風動氣諸病人皆忌之鮮菌一名土菌甘寒開胃蔬中異味以寒露時松花落地所生者無毒最佳葷素皆宜病人均忌或洗淨瀝乾以麻油或茶油沸過入秋油浸收久藏不壞設莫辨良毒切勿輕嘗中其毒者以地漿金汁解之茭白一名菰筍一名茭筍甘寒清濕熱利二便解酒毒已癩瘍止煩渴熱淋除鼻皺目黃以杭州田種肥大純白者良精滑便瀉者勿食茄一名落蘇甘涼活血止痛消癰殺蟲已瘧故一名草鱉甲消腫寬腸治傳尸勞瘕疝諸病便滑者忌之種類不一以細長深紫嫩而子少者勝葷素皆宜亦可醃曬為脯秋後者微毒病人勿食婦人血黃老茄竹刀切片陰乾為末溫酒下二錢腸風下血經霜茄子連蒂燒存性研每日空心酒服二錢匕㿉疝胎疝雙蒂茄懸房門上出入視之茄蔫所患亦蔫茄干亦干矣又法雙茄懸門上每日抱兒視之二三次釘針於上十餘日消矣磕傷青腫老黃茄極大者切如指厚新瓦焙研溫酒服二錢匕臥一宿了無痕迹熱毒瘡腫生茄一枚割去二分去瓤二分似罐子形合患處即消如已出膿再用取瘳喉痹糟茄或醬茄細嚼咽汁乳裂老茄裂開者陰乾燒存性研水調塗瓠𤬛亦作壺盧俗作葫蘆一名瓠瓜俗呼蒲蘆甘涼清熱行水通腸治五淋消腫脹其嫩葉亦可茹故詩云幡幡瓠葉採之烹之也種類不一味甘者嫩時皆可食苦者名瓠瓜入藥用老則皆可為器冬瓜一名白瓜甘平清熱養胃生津滌穢除煩消癰行水治脹滿瀉痢霍亂解魚酒等毒諸病不忌葷素咸宜惟冷食則滑腸耳以搭棚所種瓜不著地皮色純青多毛味純甘而不酸者良諸般渴痢煮冬瓜食之並飲其汁亦治水腫消暑濕若孕婦常食澤胎化毒令兒無病與蘆蔔同功發背冬瓜截去頭合瘡上瓜爛截去再合以愈為度已潰者合之亦能漸斂練瓜瓤也甘平絞汁服止消渴治淋解熱毒洗面澡身去皯𪒟令人白皙子古方所用瓜子皆冬瓜子也甘平潤肺化痰濁治腸癰皮甘平祛風熱治皮膚浮腫跌撲諸傷葉清暑治瘧痢泄瀉止渴療蜂螫惡瘡藤秋後齊根截斷插瓶中取汁服治肺熱痰火內癰諸證良絲瓜一名天羅甘涼清熱解毒安胎行乳調營補陽通絡殺蟲理疝消腫化痰嫩者為肴宜葷宜素老者入藥能補能通化濕除黃息風止血痘瘡不快初出或未出多者令少少者令稀老絲瓜近蒂三寸連皮燒存性研砂糖湯調下喉痹絲瓜搗汁灌之癰疽不斂絲瓜搗汁頻抹酒痢或便血腹痛或肛門患痔乾絲瓜煅存性研酒服二錢兼治乳汁不通經阻氣痛腰痛疝痛酒積黃疸等病化痰止嗽絲瓜煅存性研末棗肉丸彈子大每一丸酒下風熱牙痛絲瓜一條以鹽擦過煅存性研頻擦兼治腮腫水調敷小兒浮腫絲瓜燈心蔥白等分煎濃汁服並洗葉嫩時可茹絞汁服治痧穢腹痛性能消暑解毒挼貼疔腫甚妙蟲癬侵晨採帶露絲瓜葉七片逐片擦七下忌雞魚發物睪丸偏墜絲瓜葉煅存性三錢雞子殼燒灰二錢同研溫酒下湯火傷搗絲瓜葉敷苦瓜一名錦荔枝青則苦寒滌熱明目清心可醬可醃鮮時燒肉先瀹去苦味雖盛夏而肉汁能凝中寒者勿食熟則色赤味甘性平養血滋肝潤脾補腎菜瓜一名越瓜一名梢瓜生食甘寒醒酒滌熱糖醃充果醯醬為菹皆可久藏病目者忌黃瓜一名胡瓜隨園食單誤作王瓜生食甘寒清熱利水可菹可饌兼蓏蔬之用而發風動熱天行病後疳瘧瀉痢腳氣瘡疥産後痧痘皆忌之喉腫眼痛老黃瓜一條上開一小孔去瓤入芒硝令滿懸陰處待硝透出刮下吹點杖瘡湯火傷五月五日掐黃瓜入瓶內封挂簷下取水掃之南瓜早收者嫩可充饌甘溫耐飢同羊肉食則壅氣晚收者甘涼補中益氣蒸食味同番薯既可代糧救荒亦可和粉作餅餌蜜漬充果食凡時病疳瘧疸痢脹滿腳氣痞悶産後痧痞皆忌之解鴉片毒生南瓜搗汁頻灌戒鴉片癮宜用南瓜蒸熟多食永無後患火藥傷人生南瓜搗敷並治湯火傷槍子入肉南瓜瓤傅之即出晚收南瓜浸鹽滷中備用亦良胎氣不固南瓜蒂煅存性研糯米湯下虛勞內熱秋後將南瓜藤齊根剪斷插瓶內取汁服芋煮熟甘滑利胎補虛滌垢可葷可素亦可充糧消渴宜餐脹滿勿食生嚼治絞腸痧搗塗癰瘍初起丸服散瘰癧並奏奇功煮汁洗膩衣色白如玉搗葉罨毒箭及蛇蟲傷筍竹萌也甘涼舒郁降濁升清開膈消痰味冠素食種類不一以深泥未出土而肉厚色白味重軟糯純甘者良可入葷肴亦可鹽煮烘乾為臘久藏致遠出處甚繁以天目早園為勝小兒勿食恐其咀嚼不細最難克化也毛竹筍味尤重必現掘而肥大極嫩墮地即碎者佳葷素皆宜但能發病諸病後産後均忌之閩人造為漉筍以貨遠方極嫩者勝煮去劣味始可入饌産處州者較優惟山中盛夏之鞭筍嚴寒之冬筍味雖鮮美與病無妨豆腐一名菽乳甘涼清熱潤燥生津解毒補中寬腸降濁處處能造貧富攸宜洵素食中廣大教主也亦可入葷饌冬月凍透者味尤美以青黃大豆清泉細磨生榨取漿入鍋點成後嫩而活者勝其漿煮熟未點者為腐漿清肺補胃潤燥化痰漿面凝結之衣揭起晾乾為腐皮充飢入饌最宜老人點成不壓則尤嫩為腐花亦曰腐腦榨乾所造者有千層亦名百葉有腐乾皆為常肴可葷可素而腐乾堅者甚難消化小兒及老弱病後皆不宜食蘆蔔能消其積由腐乾而再造為腐乳陳久愈佳最宜病人其用皂礬者名青腐乳亦曰臭腐乳疳膨黃病便瀉者宜之生榨腐渣炒食名雪花菜熟榨者僅堪飼豬豆腐泔水浣衣去垢一味熬成膏治臁瘡甚效休息久痢醋煎豆腐食杖後青腫切豆腐片貼之頻易或以燒酒煮貼色紅即易不紅乃已解鹽滷毒熟豆腐漿灌之果食類梅酸溫生時宜蘸鹽食溫膽生津孕婦多嗜之以小滿前肥脆而不帶苦者佳食梅齒齼嚼胡桃肉解之多食損齒生痰助熱凡痰嗽疳膨痞積脹滿外感未清女子天癸未行及婦女汛期前後産後痧痘後並忌之青者鹽醃曝乾為白梅亦可蜜漬糖收法制以充方物半黃者煙燻為烏梅入藥及染色用之極熟者榨汁曬收為梅醬古人用以調饌故書曰若作和羹爾惟鹽梅也喉痹乳蛾青梅二十枚鹽十二兩醃五日取梅汁入明礬三兩桔梗白芷防風各二兩牙皂三十條俱研細末拌汁和梅入瓶收之每用一枚噙咽凡中風痰厥牙關不開以此擦之亦妙梅核膈氣半黃梅子每個用鹽一兩醃一日夜曬乾又浸又曬至水盡乃止用青錢三個夾二梅麻線縛定通裝瓷罐內封埋土中百日取出每用一枚含之咽汁入喉立愈刺在肉中白梅肉嚼傅亦治刀箭傷出血乳癰腫毒白梅煅存性研入輕粉少許麻油和圍初起已潰皆可用諸瘡努肉烏梅肉燒存性研傅久崩久痢便血日久烏梅燒存性研米飲下二錢蛔蟲上行蛔結腹痛烏梅煎湯飲指頭腫痛烏梅肉和魚鮓搗封梅花半開時收藏或蜜漬或點茶或蒸露或熬粥均妙以緑萼白梅為佳入藥舒肝解鬱清火稀痘梅葉解水毒洗葛衣則去黴點而不脆杏甘酸溫須俟熟透食之潤肺生津以大而甜者勝多食生痰熱動宿疾産婦小兒病人尤忌之亦可糖醃蜜漬收藏致遠以充方物其核中仁味苦入藥不堪食陰瘡爛痛杏仁燒黑研膏傅陰戶蟲癢杏仁燒存性研爛綿裹納入肛𧈟癢痛杏仁杵膏頻傅小兒臍爛成風杏仁去皮研傅箭鏑在咽或刀刃在咽膈諸隱處杵杏仁傅杏葉煎湯洗眼癬良叭噠杏甘涼潤肺補液濡枯仁味甘平補肺潤燥止咳下氣養胃化痰闊扁尖彎如鸚哥嘴者良去衣或生或炒亦可作酥酪雙仁者有毒勿用寒濕痰飲脾虛腸滑者忌食桃甘酸溫熟透啖之補心活血解渴充飢以晚熟大而甘鮮者勝多食生熱發癰瘡瘧痢蟲疳諸患可作脯制醬造醋凡食桃不消即以桃梟燒灰白湯下二錢吐出即愈別有一種水蜜桃熟時吸食味如甘露生津滌熱洵是仙桃北産者良深州最勝太倉上海亦産較遜桃梟桃實在樹經冬不落正月採收中實者佳煎湯服止盜汗已痁瘧桃仁治産後陰腫炒研傅婦人陰瘡杵爛綿裹塞李一名嘉慶子甘酸涼熟透食之清肝滌熱活血生津惟槜李為勝而不能多得不論何種以甘鮮無酸苦之味者佳多食生痰助濕發瘧痢脾弱者尤忌之亦可鹽曝糖收蜜漬為脯奈南産實小名林檎一名來禽一名花紅其青時體松不澀者一名桬果甘酸溫下氣生津和中止瀉瀹湯代茗味極清芬均以大者勝多食澀脈滯氣發熱生痰北産實大名頻婆俗呼蘋果甘涼輕軟別有色香潤肺悅心生津開胃耐飢醒酒辟穀救荒洵果中仙品也栗甘平補腎益氣厚腸止瀉耐飢最利腰腳解羊肉毒辟穀濟荒生熟皆佳點肴並用嫩時嚼之作桂花香老者風乾則甜而嫩同橄欖食風味尤美以錢塘産者良凡食均須細嚼連液吞咽則有益若頓食至飽反壅氣傷脾其外感未去痞滿疳積瘧痢瘰癧産後小兒病人不飢便祕者並忌之以生極難化熟最滯氣也棗鮮者甘涼利腸胃助濕熱多食患脹瀉熱渴最不益人小兒尤忌乾者甘溫補脾養胃滋營充液潤肺安神食之耐飢亦可浸酒取瓤作餡葷素皆宜殺烏頭附子天雄川椒毒臥時口含一枚可解悶香以北産大而堅實肉厚者補力最勝名膠棗亦曰黑大棗色赤者名紅棗氣香味較清醇開胃養心醒脾補血亦以大而堅實者勝可取瓤和粉作糕餌焚之辟邪穢歉歲均可充糧義烏所産為南棗功力遠遜僅供食品徽人所制蜜棗尤為膩滯多食皆能生蟲助熱損齒生痰凡小兒産後及溫熱暑濕諸病前後黃疸腫脹疳積痰滯並忌之梨甘涼潤肺清胃涼心滌熱息風化痰已嗽養陰濡燥散結通腸消癰疽止煩渴解丹石煙煤炙煿膏粱曲糵諸毒治中風不語痰熱驚狂溫暑等疴並絞汁服名天生甘露飲以皮薄心小肉細無渣略無酸味者良北産尤佳切片貼湯火傷止痛不爛中虛寒瀉乳婦金瘡忌之新産及病後須蒸熟食之與蘆蔔相間收藏則不爛可搗汁熬膏亦可醬食木瓜酸平調氣和胃養肝消脹舒筋息風去濕蜜漬酒浸多食患淋以酸澀太過也專治轉筋能健腰腳故老人宜佩也腳氣筋攣以木瓜切片囊盛日踐踏之霍亂轉筋木瓜一兩煎服仍煎湯浸青布裹其足闢臭蟲木瓜片鋪席下反花痔木瓜末鱔魚身上涎調塗黴瘡結毒木瓜一味研末水法丸日以土茯苓湯下三錢柿俗作柿鮮柿甘寒養肺胃之陰宜於火燥津枯之體以大而無核熟透不澀者良或採青柿以石灰水浸過則澀味盡去削皮啖之甘脆如梨名曰緑柿凡中氣虛寒痰濕內盛外感風寒胸腹痞悶産後病後瀉痢瘧疝痧痘後皆忌之不可與蟹同食干柿甘平健脾補胃潤肺澀腸止血充飢殺疳療痔治反胃已腸風老稚咸宜果中聖品以北産無核者勝惟太柔腴不堪藏久柿餅柿花功用相似體堅耐久並可充糧反胃便瀉並以柿餅飯上蒸熟日日同飯嚼食能不飲水更妙凡小兒初食飯時亦如此嚼喂甚良産後嗽逆氣亂心煩柿餅碎切煮汁飲痰嗽帶血大柿餅飯上蒸熟每用一枚批開攙真青黛一錢臥時食之薄荷湯下痘瘡入目柿餅日日食之解桐油銀黝毒多食柿餅熱痢血淋柿餅細切同粳米煮粥食柿霜乃柿之精液甘涼清肺治吐血咯血勞嗽上消咽喉口舌諸病甚良柿蒂下氣治咳逆噎噦氣衝不納之證柿漆另有一種小柿雖熟而色不赤名曰椑柿亦曰漆柿須於小暑前柿未生核時採而搗爛其汁如漆可以染罾葛造扇蓋性能卻水也亦可生啖性尤冷利石榴甘酸溫澀解渴析酲多食損肺傷齒助火生痰最不益人但供觀美而已皮可染皂中蟲毒石榴皮煎濃飲腿肚生瘡初起如栗搔之漸開黃水浸淫癢痛潰爛遂致繞脛而成錮疾酸榴皮煎濃汁冷定頻掃花治吐血研末吹鼻止衄血亦傅金瘡出血以千葉大紅者良按諸花忌澆熱水惟此花可以烈日中灌溉並宜以葷濁熱湯澆之則益茂但勿著鹹味耳正月二十日分枝則當年即花物性之難測如此余幼時見業師王烺中先生善養此花而人罕知其法故附識以傳於世橘甘平潤肺析酲解渴閩産者名福橘黃岩所産皮薄色黃者名蜜橘俱無酸味而少核皆為佳品然多食生痰聚飲風寒咳嗽及有痰飲者勿食味酸者戀膈滯肺尤不益人並可糖醃作脯名曰橘餅以其連皮造成故甘辛而溫和中開膈溫肺散寒治嗽化痰醒酒消食橘皮解魚蟹毒化痰下氣治咳逆嘔噦噫噎脹悶霍亂疳瘧瀉痢便祕腳氣諸病皆效去白者名橘紅陳久愈良福橘皮為勝或瀹茗時入一片亦妙惟化州無橘俗尚化州橘紅其色不紅皆柚皮也産後溺閉不通橘紅二錢為末空心溫酒下乳吹橘皮一兩甘草一錢水煎服魚骨鯁橘皮常含咽汁嵌甲痛不能行橘皮煎濃湯浸良久甲肉自離輕手剪去以虎骨末敷之橘核治疝氣乳癰橘葉消癰腫治乳癖金橘廣州志名夏橘上林賦曰盧橘甘溫醒脾下氣闢穢化痰止渴消食解酲其美在皮以黃岩所産形大而圓皮肉皆甘而少核者勝一名金蛋亦可糖醃壓餅橙皮甘辛利膈辟惡化痰消食析酲止嘔醒胃殺魚蟹毒可以為菹可以拌齏可以為醬糖制宜餡蜜製成膏嗅之則香咀之則美洵佳果也肉不堪食惟廣東産者可與福橘爭勝香橙餅橙皮二斤切片白砂糖四兩烏梅肉二兩同研爛入甘草末一兩檀香末五錢搗成小餅收干藏之每噙口中生津舒郁闢臭解酲化濁痰御嵐瘴調和肝胃定痛止嘔湯瀹代茶亦可供客柑甘寒清熱止渴析酲以永嘉所産者名甌柑核少無滓最勝京師呼為春橘多食滑腸停飲傷肺寒中凡氣虛脾弱風寒為病産婦小兒及諸病後忌之種類甚多大小不一海紅柑樹小而結實甚大皮厚肉紅可久藏俗呼文旦生枝柑形不圓色青膚粗味微酸留之枝間大可耐久俟味變甘乃帶葉折故名俗呼蜜羅柑皮辛甘涼下氣調中解酒殺魚腥氣可以入茗或去白焙研末點湯入鹽飲亦有用湯瀹過以之煨肉者柚一名朱欒一名香欒俗作香櫞者非酸寒闢臭消食解酲多食之弊更甚於柑種類甚繁大小不一俗呼大者為香脬小者為香圓柚皮辛苦而甘消食化痰散憤悶之氣陳久者良佛手柑圖經名枸櫞亦名香櫞今人誤以柚之小者為香櫞蓋失考也辛溫下氣醒胃豁痰辟惡解酲消食止痛多食耗氣虛人忌之金華産者勝味不可口而清香襲人置之案頭可供玩賞置芋片於蒂而以濕紙圍護經久不癟搗蒜罨其蒂則香更充溢浸汁浣葛紵最妙亦可蜜漬收藏入藥以陳久者良蒸露尤妙其花功用略同枇杷甘平潤肺滌熱生津以大而純甘獨核者良多食助濕生痰脾虛滑瀉者忌之蜜餞糟收可以藏久葉毛多質韌味苦氣平隆冬不調盛夏不萎稟激濁揚清之性抱忘炎耐冷之姿靜而能宣凡風溫溫熱暑燥諸邪在肺者皆可藉以保柔金而肅治節香而不燥凡濕溫疫癘穢毒之邪在胃者皆可用以澄濁氣而廓中州本草但言其下氣止渴專治嘔嗽噦噫何其疏耶宜以夏前採葉刷毛洗淨切碎淨鍋炒燥入瓶密收用以代茶常飲可免時氣沾染真妙法也亦可蒸露山楂亦作查一名山裡果北産者大亦名棠球俗名紅果酸甘溫醒脾氣消肉食破瘀血散結消脹解酒化痰除疳積已瀉痢大者去皮核和糖蜜搗為糕名楂糕色味鮮美可充方物入藥以義烏産者勝多食耗氣損齒易飢空腹及羸弱人或虛病後忌之痘疹乾黑危困山楂為末紫草煎酒調服一錢輕者白湯下即時紅活食肉不消山楂四兩水煮食並飲其汁腸風下血山楂為末艾湯調服惡露不行腹痛山楂煎湯調砂糖服楊梅甘酸溫宜蘸鹽少許食析酲止渴活血消痰滌腸胃除煩悶惡氣鹽藏蜜漬酒浸糖收為脯為干消食止痢大而純甜者勝多食動血酸者尤甚諸病挾熱者忌之樹皮煎湯洗惡瘡疥癬漱牙痛澄冷服解砒毒研末燒酒調敷治遠近攣筋燒灰油調敷湯火傷櫻桃甘熱溫中不宜多食諸病皆忌小兒遠之酸者尤甚青蔗漿能解其熱銀杏一名白果生苦平澀消毒殺蟲滌垢化痰擦面去皶疱皯𪒟皴皺及疥癬疳𧈟陰蝨熟甘苦溫暖肺益氣定喘嗽止帶濁縮小便多食壅氣動風小兒發驚動疳中其毒者昏暈如醉白果殼或白鯗頭煎湯解之食或太多甚至不救慎生者不可不知也小便頻數腸風下血赤白帶下並以白果煨熟去火氣細嚼米飲下手足皴裂下疳陰蝨頭面癬瘡並用生白果杵爛塗擦針刺入肉瓷鋒嵌腳水疔暗疔並將白果肉浸菜油中年久愈佳搗敷患處胡桃一名核桃甘溫潤肺益腎利腸化虛痰止虛痛健腰腳散風寒助痘漿已勞喘通血脈補産虛澤肌膚暖水臟制銅毒療諸痛殺羊膻解齒齼以殼薄肉厚味甜者良宜餡宜肴果中能品惟助火生痰非虛寒者勿多食也風寒感冒頭痛身熱胡桃肉蔥白細茶生薑共杵爛水煎熱服汗出而痊內熱者去薑加白砂糖小便頻數胡桃肉臥時嚼之溫酒下石淋痛楚胡桃肉一斤同細米煮漿粥日日食之小腸氣痛便毒初起並以胡桃煅研溫酒下背癰附骨疽未成膿者胡桃十個煨熟去殼槐花一兩同研熱酒調下疔瘡惡瘡胡桃破開取肉嚼爛仍安殼內合瘡上頻換壓撲損傷胡桃肉杵爛溫酒頓服榛甘平補氣開胃耐飢長力厚腸虛人宜食仁粗大而不油者佳亦可磨點成腐與杏仁腐皆為素饌所珍梧桐子甘平潤肺清熱治疝諸病無忌鮮更清香桑椹甘平滋肝腎充血液止消渴利關節解酒毒祛風濕聰耳明目安魂鎮魄可生啖宜微鹽拌食可飲汁或熬以成膏或曝乾為末設逢歉歲可充糧食久久服之鬚髮不白以小滿前熟透色黑而味純甘者良熟桑椹以布濾取汁瓷器熬成膏收之每日白湯或醇酒調服一匙老年服之長精神健步履息虛風靖虛火兼治水腫脹滿瘰癧結核櫧子有甜苦二種苦者煮炒令熟味亦帶甘並可食亦可磨粉充糧耐飢止瀉氣實腸燥者勿食患酒膈者苦櫧煮熟細嚼頻食自愈橡實櫟樹子也其殼可染皂故一名皂鬥苦溫須浸透去其澀味蒸煮極熟食之補脾胃益氣力止瀉耐飢性似栗櫧可御凶年杜工部客秦州嘗採以自給其嫩葉亦可煎飲代茶癰堅如石不作膿橡斗子用醋於青石上磨汁塗干則易自平荔枝甘溫而香通神益智填精充液闢臭止疼滋心營養肝血果中美品鮮者尤佳以核小肉厚而純甜者勝多食發熱動血損齒凡上焦有火者忌之食之而醉者即以其殼煎湯或蜜湯解之痘瘡不發荔枝肉浸酒飲並食之忌生冷諸疔荔枝肉白梅肉各三個搗餅貼之根即出龍眼一名桂圓俗呼圓眼甘溫補心氣定志安神益脾陰滋營充液果中神品老弱宜之以核小肉厚味純甘者良然不易化宜煎汁飲外感未清內有鬱火飲停氣滯脹滿不飢諸候均忌玉靈膏一名代參膏自剝好龍眼肉盛竹筒式瓷碗內每肉一兩入白洋糖一錢素體多火者再入西洋參片如糖之數碗口冪以絲綿一層日日於飯鍋上蒸之蒸到百次凡衰羸老弱別無痰火便滑之病者每以開水瀹服一匙大補氣血力勝參耆産婦臨盆服之尤妙核研末名驪珠散傅刀刃跌打諸傷立能止血定痛愈後無瘢殼研細治湯火傷焚之闢蛇橄欖一名青果酸甘平開胃生津化痰滌濁除煩止渴涼膽息驚清利咽喉解魚酒野菌毒鹽藏藥制功用良多點茶亦佳以香嫩多汁者勝河豚魚鱉諸毒諸魚骨鯁橄欖搗汁或煎濃湯飲無橄欖以核研末或磨汁服下疳橄欖燒存性研油調敷兼治耳足凍瘡稀痘橄欖核常磨濃如糊頻與小兒服之欖仁甘平潤肺解毒殺蟲稀痘制魚腥塗唇吻燥痛小兒及病後宜以為果餌棐甘溫潤肺止嗽化痰開胃殺蟲滑腸消穀可生啖可入素羹豬脂炒皮自脫以細而殼薄者佳多食助火熱嗽非宜腸胃諸蟲患每晨食棐肉七枚以愈為度海松子甘平潤燥補氣充飢養液息風耐飢溫胃通腸闢濁下氣香身最益老人果中仙品宜肴宜餡服食所珍檳榔苦甘溫澀下氣消痰闢瘴殺蟲析酲化食除脹泄滿宣滯破堅定痛和中通腸逐水制肥甘之毒膏粱家宜之尖長質較軟色紫而香俗呼棗兒檳榔者良且能堅齒解口氣惟虛弱人及淡泊家忌食枳椇一名雞距子甘平潤燥止渴除煩利大小腸專解酒毒多食發蛔蟲無花果甘寒清熱療痔潤腸上利咽喉中寒忌食蒲桃甘平補氣滋腎液益肝陰養胃耐飢御風寒強筋骨通淋逐水止渴安胎種類甚多北産大而多液味純甜者良無核者更勝可干可釀枸杞同功胎上衝心蒲桃煎湯飲無則用藤葉亦可嘔噦霍亂溺閉小腸氣痛並以蒲桃藤葉煎濃汁飲外可淋洗腰腳腿痛附種蒲桃法正月末取蒲桃嫩枝長四五尺者卷為小圈令緊實先治地土松而沃之以肥種之止留二節在外候春氣透發衆萌竟吐而土中之節不能條達則盡萃於出土之二節不二年成大棚其實如棗且多液也落花生一名長生果煮食甘平潤肺解毒化痰炒食甘溫養胃調氣耐飢入饌頗佳榨油甚劣以肥白香甘者良有火者但宜煮食西瓜甘寒清肺胃解暑熱除煩止渴醒酒涼營療喉痹口瘡治火毒時證雖霍亂瀉痢但因暑火為病者並可絞汁灌之以極甜而作梨花香者勝一名天生白虎湯多食積寒助濕每患秋病中寒多濕大便滑泄病後産後均忌之食瓜腹脹者以冬醃乾菜瀹湯飲即消瓜瓤餵豬肉味美色佳而不膩瓜肉曝乾醃之亦可醬漬以作小菜食之已目赤口瘡肉外青皮以瓷鋒刮下名西瓜翠衣入藥涼驚滌暑瓜子生食化痰滌垢下氣清營一味濃煎治吐血久嗽皆妙剝配橙飣作餡甚美帶殼炒香佐酒為雅俗共賞之尤大者勝甜瓜甘寒滌熱利便除煩解渴療飢亦治暑痢種類匪一以清香甘脆者勝多食每患瘧痢凡虛寒多濕便滑腹脹腳氣及産後病後皆忌之其子亦可食黃疸鼻瘜濕家頭痛並用瓜蒂為末吹鼻內口含冷水俟鼻出黃水愈藕甘平生食生津行瘀止渴除煩開胃消食析酲治霍亂口乾療産後悶亂罨金瘡止血定痛殺射罔魚蟹諸毒熟食補虛養心生血開胃舒郁止瀉充飢搗罨凍瘡亦可入饌果中靈品久食休糧以肥白純甘者良生食宜鮮嫩煮食宜壯老用砂鍋桑柴緩火煨極爛入煉白蜜收干食之最補心脾若陰虛肝旺內熱血少及諸失血證但日熬濃藕湯飲之久久自愈不服他藥可也老藕搗浸澄粉為産後病後衰老虛勞妙品但須自制市物恐攙雜不真也市中熟藕多雜穢物故易糜爛最不宜食諸病皆忌藕節入藥功專止血藕實即蓮子鮮者甘平清心養胃治噤口痢生熟皆宜乾者甘溫可生可熟安神補氣鎮逆止嘔固下焦已崩帶遺精厚腸胃愈二便不禁可磨以和粉作糕或同米煮為粥飯健脾益腎頗著奇勳以紅花所結肉厚而嫩者良但性澀滯氣生食須細嚼熟食須開水泡剝衣挑心煨極爛凡外感前後瘧疸疳痔氣鬱痞脹溺赤便祕食不運化及新産後皆忌之汪謝城曰陳蓮子雖久煮不糜取蓮根新出嫩芽同煮則爛矣薏蓮子心也苦涼斂液止汗清熱養神止血固精所謂能靖君相火邪也勞心吐血蓮心七枚糯米二十一粒為末酒下心動精遺蓮心一錢研末入辰砂一分淡鹽湯下蓮鬚苦澀治遺精失血蓮花貼天泡瘡以一瓣書人字於上吞之可催生研末酒服方寸匕治跌打嘔血白者蒸露清心滌暑涼營千葉小瓣者鮮服壯陽蓮房蓮蓬殼也破血亦能止血酒煮服治胎衣不下水煎飲解野菌毒杆通氣舒筋升津止渴霜後採者清熱止盜汗行水愈崩淋葉功用與房略同其色青其象震故能升發膽中清氣以達脾氣凡脾虛氣陷而為便瀉不運者可佐入培中之劑如荷米煎之類是也古方荷葉燒飯即是此義蓋燒飯即煮飯後人拘泥字面不解方言入火燒焦全失清芳氣味矣凡上焦邪盛治宜清降者切不可用東垣清震湯之謬章杏云已力辨其非試察其能治痘瘡倒陷則章氏之言益信痘疹論云痘瘡倒陷若由風寒外襲竅閉血凝漸變黑色身痛肢厥者溫肌散邪則氣行而痘自起也用霜後荷葉貼水紫背者炙乾白直殭蠶炒去絲等分為末每服五分溫酒或芫荽湯調下蓋荷葉能升發陽氣散瘀血留好血殭蠶能解結滯之氣故也此藥平和易得而活人甚多勝於人牙龍腦多矣名南金散陽水浮腫敗荷葉燒存性研每二錢米飲下日三諸般癰腫荷葉蒂不拘多少煎湯淋洗拭乾以飛過寒水石同臘豬脂塗之能拔毒止痛孕婦傷寒大熱煩渴恐傷胎氣嫩卷荷葉焙乾五錢蚌粉減半共研每三錢新汲水入蜜調服並塗腹上名罩胎散胎動已見黃水乾荷蒂一枚炙研糯米淘汁一鐘調下赤白痢荷葉煅研每二錢糖湯下脫肛貼水荷葉焙研酒服三錢並以荷葉盛末坐之赤遊火丹新生荷葉杵爛入鹽塗陰腫痛癢荷葉浮萍蛇床煎湯日洗漆瘡乾荷葉煎湯洗刀斧傷荷葉煅研傅遍身風癘荷葉三十張石灰一斗淋汁合煮漬之半日乃出數日一作芡實一名雞頭甘平補氣益腎固精耐飢渴治二便不禁強腰膝止崩淋帶濁必蒸煮極熟枚齒細咀使津液流通始為得法鮮者鹽水帶殼煮而剝食亦良乾者可為粉作糕煮粥代糧亦入藥劑惟能滯氣多食難消禁忌與蓮子同其莖嫩時可茹能清虛熱根可煮食祲歲濟飢葉一張須囫圇者煎湯服治胞衣不下菱芰鮮者甘涼析酲清熱多食損陽助濕胃寒脾弱人忌之老者風乾肉反轉嫩熟者甘平充飢代谷亦可澄粉補氣厚腸多食滯氣胸腹痞脹者忌之芡花向日菱花向月故芡暖而菱寒鏡號菱花謂女人容貌如月也鳧茈即荸薺一名烏芋一名地栗甘寒清熱消食析酲療膈殺疳化銅闢蠱除黃泄脹治痢調崩以大而皮赤味甜無渣者良風乾更美多食每患脹痛中氣虛寒者忌之煮熟性平可入肴饌可御凶年澄粉點目去翳如神味亦甚佳殊勝他粉闢蠱荸薺曬為末每白湯下二錢蠱家知有此物即不敢下血崩荸薺一歲一枚煅存性研酒調下便血搗荸薺汁一鍾好酒半鍾和空心溫服赤白痢午日午時取完好荸薺洗淨拭乾勿令損破安瓶內入好燒酒浸之黃泥密封收藏每用二枚細嚼空心原酒下慈菰俗作茨菰一名白地栗一名河鳧茈甘苦寒用灰湯煮熟去皮食則不麻澀入肴加生薑以制其寒功專破血通淋滑胎利竅多食發瘡動血損齒生風凡孕婦及癱瘓腳氣失血諸病尤忌之百合甘平潤肺補胃清心定魄息驚澤膚通乳祛風滌熱化濕散癰治急黃止虛嗽殺蠱毒療悲哀闢諸邪利二便下平腳氣上理咽喉以肥大純白味甘而作檀香氣者良或蒸或煮而淡食之專治虛火勞嗽亦可煮粥煨肉澄粉食並補虛羸不僅充飢也入藥則以山中野生彌小而味甘者勝風寒痰嗽中寒便滑者勿食山丹俗呼紅花百合種類不一亦有黃花者甘苦涼清營滌暑潤燥通腸剝去外一層水浸去苦味或蒸或煮加白洋糖食之耐飢亦可煮粥澄粉補力雖遜似亦益人忌同上按藕粉百合粉之外尚有嘉定澄造之天花粉陰虛內熱及便燥者服之甚宜余者只可充平人之食不可調養病人最不堪者徽州之葛根粉非風寒未解者皆不可食甘蔗甘涼清熱和胃潤腸解酒節蛔化痰充液治疸瘧暑痢止熱嗽虛嘔利咽喉強筋骨息風養血大補脾陰榨漿名天生復脈湯以皮青圍大節稀形如竹竿者勝故一名竹蔗亦作竿蔗與棐仁同嚼則渣軟皮紫者性溫功遜蔗飴蔗汁煎成如飴色黑今人呼曰砂糖甘溫和中活血止痛舒筋越人産後輒服之然多食助熱生痰傷營滯胃凡內熱或血不阻者忌之赤沙糖出處不一品色甚多有青糖紅糖球糖綿糖等名甘溫暖胃緩肝散寒活血舒筋止痛制鴉片煙吳人産後用以行瘀多食損齒生蟲其弊如上以上兩種味不帶酸苦者佳白砂糖即白洋糖亦曰白糖古名石蜜此乃竹蔗煎成堅白如冰者為冰糖輕白如霜者為糖霜凡霜一甕其中品色亦自不同故有冰花上白次白等名也甘平潤肺和中緩肝生液化痰止嗽解渴析酲殺魚蟹腥制豬肉毒闢韭蒜臭降濁怡神辛苦潛移酸寒頓改調元贊化燮理功優冰糖糖霜均以最白者為良多食久食亦有損齒生蟲之弊痞滿嘔吐濕熱不清諸糖並忌解鹽滷毒糖霜多食小兒未能穀食久瘧不瘳濃煎冰糖湯服中虛脘痛痘不落痂食魚蟹而不舒啖蒜韭而口臭並以糖霜點濃湯飲噤口痢冰糖五錢烏梅一個煎濃頻呷汪謝城曰諸糖時邪痧疹霍亂皆大忌余見誤服致危者不一其人即夏月産後用以行瘀亦宜慎也吾叔苦志力學自垂髫以來憂勤惕厲垂四十餘年雖經世變身超物外得以隨處而息焉遊焉乃飲水思源譜是書寓意故以水始次穀食而以胡麻冠於調和抑鹽於油後者蓋土産百物天之所以養人不欲官與其事也次蔬果而以蔗糖殿者將及肉食豫伏制豬肉毒之糖霜於前也伏讀至此不但經綸足以濟世烈且以知叔之晚境如飴更有甘蔗旁生之兆焉毛羽類豶豬肉去勢曰豶甘鹹平補腎液充胃汁滋肝陰潤肌膚利二便止消渴起尪羸以壯嫩花豬糯而易熟香而不腥臊者良烹法甚多惟整塊洗淨略抹糖霜干蒸極爛者味全力厚最為補益古人所謂蒸豚也吳俗尚蹄肘乃古之豚肩遺意但須緩火煨化嘉蘇婦人不事中饋而尚市脯劣廚欲速用硝不但失飪亦且暴殄多食助濕熱釀痰飲招外感昏神智令人鄙俗故先王立政但以為養老之物聖人云勿使勝食氣而回回獨謂此肉為葷也末俗貪叨不甘淡泊厚味臘毒漫不知省蔑禮糜財喪其廉儉具不得已之苦心者假神道以設教創持齋之日期雖屬不經良有深意若幼時勿縱其口腹不但無病且易成人至一切處感及哮嗽瘧痢痧疸霍亂脹滿腳氣時毒喉痹痞滿疔癰諸病切忌之其頭肉尤忌産後食肉亦勿太早痧痘時病後須過彌月始可食也新鮮之肉曰腥論語君賜腥是也方書所云忌食新鮮之鮮忌食魚腥之腥皆指此言也醫家病家往往顢頇不省故詳及之其未經去勢之豭豬肉婁豬肉皆不堪食黃凵凵干豬肉瘟豬肉並有毒雖平人亦忌之中其毒者芭蕉根搗汁服小兒火丹及打傷青腫破傷風並用新宰豬肉乘熱片貼頻易液干難産津枯血奪火灼燥渴干嗽便祕並以豬肉煮湯吹去油飲豬皮杭人以乾肉皮煮熟刮去油刨為薄片暴燥以充方物名曰肉酢久藏不壞用時以涼開水浸軟麻油鹽料拌食甚佳按皮即膚也豬膚甘涼清虛熱治下痢心煩咽痛今醫罕用此藥矣若無心煩咽痛兼證者是寒滑下利不宜用此凡勘病擇藥先須辨此庶不貽誤千里脯冬令極冷之時取㷟淨好豬肋肉每塊約二斤余勿浸水氣晾乾後去其裡面浮油及脊骨肚囊用糖霜擦透其皮並抹四圍肥處若用鹽亦可然藏久易酵也懸風多無日之所至夏煮食或加鹽醬煨味極香美且無助濕發風之弊為病後産後虛人食養之珍蘭熏一名火腿甘鹹溫補脾開胃滋腎生津益氣血充精髓治虛勞怔忡止虛痢泄瀉健腰腳愈漏瘡以金華之東陽冬月造者為勝浦江義烏稍遜他邑不能及也逾二年即為陳腿味甚香美甲於珍饈養老補虛洵為極品取腳骨上第一刀俗名腰封刮垢洗淨整塊置盤中飯鍋上干蒸悶透如是七次極爛而味全力厚切食最補然必上上者始堪如此蒸食否則非咸則硬矣或老年齒落或病後脾虛少運則熬湯撇去油但飲其汁可也外感未清濕熱內戀積滯未淨脹悶未消者均忌時病愈後食此太早反不生力或致浮腫者皆餘邪未淨故耳附醃腿法十一月內取壯嫩花豬後腿花豬之蹄甲必白㷟淨取下勿去蹄甲勿灌氣勿浸水用力自爪向上緊捋有血一股向腿面流出即拭去此血不擠出則至夏必臭晾一二日待乾將腿面浮油細細剔淨不可傷膜若膜破或去蹄甲則氣泄而不能香每腿十斤用燥鹽五兩鹽不燥透則滷味入腿而帶苦竭力擦透其皮然後落缸腳上懸牌記明月日缸半預做木板為屜屜鑿數孔將擦透之腿平放板屜之上余鹽均灑腿面腿多則重重疊之不妨鹽煬為滷則從屜孔流至缸底醃腿以此為要訣蓋沾滷則肉黴而必苦也既醃旬日將腿翻起再用鹽如初醃之數逐腿灑勻再旬日再翻起仍用鹽如初醃之數逐腿灑勻再旬日自初醃至此匝一月也將腿起缸浸溪中半日刷洗極淨隨懸日中曬之故起缸必須晴日若雨雪不妨遲待如水氣曬乾後陰雨則懸當風處晴霽再曬之必須水氣幹盡皮色皆紅可不曬矣修圓腿面入夏起花以緑色為上白次之黃黑為下並以菜油遍抹之若生蟲有蛀孔以竹籤挑出菜油灌之入伏裝入竹箱盛之苟知此法但得佳豬處處可造常州造腿未得此法且後腿之外余肉皆可按法醃藏雖補力較遜而味亦香美以為夏月及忌新鮮者之用噤口痢醃肉脯煨爛食中諸肉毒及諸食停滯惡痢不瘳並用陳火腿骨煅存性研開水下按紀文達公云油膩得灰即解散故油膩凝滯之病即以其物燒灰調脹自愈猶之以灰浣垢耳余謂尚未盡然如過食白果荔枝而醉者即以其殼煎湯飲之立解吾杭市脯獨香黏味美者其煮豬肉或羊肉鍋中之湯永不輕棄但日撇浮油加鹽添水煮之名曰老汁故物易化也即純用秋油醇酒煨雞鴨鹿豕等肉之滷鍋亦功在老汁故味美易糜觀此則食物不消當以本物消之之義別有至理存焉豬脂俗呼板油甘涼潤肺澤稿濡枯滋液生津息風化毒殺蟲清熱消腫散癰通腑除黃滑胎長髮以白厚而不腥臊者良臘月煉之瓷器收藏每油一斤入糖霜一錢於內經久不壞暑月生豬脂以糖霜醃之亦可久藏此物性之相制也外感諸病大便滑瀉者均忌胞衣不下小便不通並以豬脂一兩水一盞煎數沸服小兒蛔病羸瘦頻服豬油中諸肝毒豬油一盞頓服痘瘡便祕四五日肥豬脂一塊水煮熟切如豆大與食自然臟腑滋潤痂亦易落無損於兒乳癰發背諸腫毒豬脂切片冷水浸貼熱即易以散盡為度誤吞鐵釘豬脂多食令飽自然裹出豬腦性能柔物可以熟皮塗諸癰腫及手足皸裂皆效多食損人患筋軟陽萎豬𦚠俗作胰甘平潤燥滌垢化痰運食清胎澤顏止嗽凡婦人子宮脂滿不受孕及交合不節而子宮不淨者皆宜蒸煮為肴久食自可受孕妊婦食之蠲胎垢其兒出痘必稀小兒食之消積滯可免疳黃諸病且血肉之品無克伐之慮雖頻食亦無害也所謂澤顏止嗽者非用以作面脂而治肺也食此則痰垢潛消無穢濁熏蒸之弊容顏自澤而咳嗽自平矣豬肺甘平補肺止虛嗽治肺痿咳血上消諸證用須灌洗極淨煮熟盡去筋膜再煮糜化食或和米作粥或同苡仁末為羹皆可豬之臟腑不過為各病引經之用平人不必食之不但腸胃垢穢可憎而肺多涎沫心有死血治淨匪易烹煮亦難君子不食豢腴有以夫豬心甘鹹平補心治恍惚驚悸顛癇憂恚諸證皆取其引入心經以形補形而藥得祛病以外出也煮極難熟余病皆忌豬肝甘苦溫補肝明目治諸血病用為響導余病均忌平人勿食打傷青腫炙豬肝貼之一切癰腫初起新宰牡豬肝切如瘡大一塊貼之以布纏定周時即愈肝色變黑狗亦不食陰癢炙豬肝納入當有蟲出豬膽苦寒補膽清熱治熱痢通熱祕殺疳蟲去目翳傅惡瘡治厥顛疾浴嬰兒沐發生光小兒初生豬膽汁入湯浴之不生瘡疥喉痹臘月朔取豬膽不拘大小五六枚用黃連青黛薄荷殭蠶白礬朴硝各五錢裝入膽內青紙包了掘一地窟深方各一尺以竹橫懸此膽於內用板蓋定候至立春日取出待風吹去青紙膽皮研末密收每吹少許赤白痢臘月豬膽百枚俱盛黑豆入內著麝香少許陰乾每用五七粒為末生薑湯下疔瘡惡毒臘月豬膽風乾和生蔥搗傅湯火傷豬膽汁調黃柏末塗豬腰子豬內腎也甘鹹平煮極難熟俗尚嫩食實生啖也腰痛等證用以引經殊無補性或煮三日俾極熟如泥以為老人點食頗可耐飢諸病皆忌小兒尤不可食癰疽發背初起豬腰子一對同飛面杵如泥傅豬石子外腎也甘鹹溫通腎治五癃奔豚莖痛陰陽易少腹急痛顛癇驚恐鬼蛀蠱毒諸證無是病者勿食豬脾一名聯貼俗名草鞋底甘平消痞甚不益人豬胃俗呼豬肚甘溫補胃益氣充飢退虛熱殺勞蟲止帶濁遺精散癥瘕積聚肉厚者良須治潔煨糜頗有補益外感未清胸腹痞脹者均忌胎氣不足或屢患半産及娩後虛羸豬肚煨糜頻食同火腿煨尤補中虛久瀉豬肚一枚入蒜煮糜杵爛丸梧桐子大每米飲下三十丸虛弱遺精豬肚一枚入帶心連衣紅蓮子煮糜杵丸桐子大每淡鹽湯下三十丸豬腸甘寒潤腸止小便數去下焦風熱療痢痔便血脫肛治淨煨糜食外感不清脾虛瀉滑者均忌腸風臟毒血痢不已脫肛出血並以豬大腸入槐花末令滿縛定以醋煮爛搗丸梧子大每二十丸米飲下豬脬甘鹹涼炙食治夢中遺溺豬脊髓甘平補髓養陰治骨蒸勞熱帶濁遺精宜為衰老之饌豬血鹹平行血殺蟲余病皆忌豬蹄爪甘鹹平填腎精而健腰腳滋胃液以滑皮膚長肌肉可愈漏瘍助血脈能充乳汁較肉尤補煮化易凝宜忌與肉同老母豬者勝婦人無乳及乳癰發背初起並以母豬蹄一雙通草同煮食並飲其汁硇砂損陰豬蹄一隻浮萍三兩煮汁漬之冷即出以粉傅之豬乳甘鹹涼初生小兒飲之無驚癇痘疹之患大人飲之可斷酒狗肉廣南名曰地羊本草云味酸溫中其毒者杏仁解之孕婦食之令子無聲時病後食之必死道家謂之地厭羊肉甘溫暖中補氣滋營御風寒生肌健力利胎産愈疝止疼肥大而嫩易熟不膻者良秋冬尤美與海參蘆蔔筍栗同煨皆益人加胡桃煮則不膻多食動氣生熱不可同南瓜食令人壅氣發病時感前後瘧痢疳疸脹滿顛狂哮嗽霍亂諸病及痧痘瘡疥初愈均忌新産後僅宜飲汁勿遽食肉産後虛羸腹痛覺冷自汗帶下或乳少或惡露久不已均用羊肉切治如常煮糜食之兼治虛冷勞傷虛寒久瘧羊脂甘溫潤燥治勞痢澤肌膚補胃耐飢御風寒療痿痹殺蟲治癬利産舒筋多食滯濕釀痰外感不清痰火內盛者均忌婦人陰脫赤丹如疥並煎羊脂塗發背初起羊脂切片冷水浸貼熱即易之誤吞針鐵多食羊脂則自下羊腦甘溫治風寒入腦頭疼久不愈者良多食發風生熱余病皆忌羊骨髓甘溫潤五臟充液補諸虛調養營陰滑利經脈卻風化毒填髓耐飢衰老相宜外感咸忌羊血鹹平生飲止諸血解諸毒治崩衄及死胎不下産後血悶欲絶胎衣不落並誤吞一切金石草木蜈蚣水蛭者均宜熱服即瘳熟食但能止血患腸風痔血者宜之羊脊骨甘溫補腎利督強腰脛骨磨銅頭骨消鐵羸老胃弱羊脊骨一具捶碎熬取濃汁煮粥常食腎虛腰痛羊脊骨一具捶碎熬取濃汁和鹽料食膏淋虛濁虛利羊脊骨煅研末米飲湯下二錢誤食金銀銅錢羊脛骨煅研三錢米飲下誤吞鐵物羊頭骨煅研調稀粥食羊肺甘平補肺氣治肺痿止咳嗽行水通小便亦治小便頻數病後産後虛羸老弱皆可以羊之臟腑煮爛食之外感未清者均忌羊心甘平補心舒鬱結釋憂恚治勞心膈痛如神余先慈苦節撫孤遂患此證諸藥不應食此即愈後屢發用之輒效久食竟痊羊肝甘涼補肝明目清虛熱息內風殺蟲愈癇消疳蠲忿諸般目疾並可食之羊膽苦寒清膽熱補膽汁專療諸般目疾兼治蠱毒瘡瘍目疾羊膽汁點或煮熟吞之代指以指刺熱湯中七度刺冷水中三度隨以羊膽汁塗之羊腰子羊內腎也甘平補腰腎治腎虛耳聾療癥瘕止遺溺健腳膝理勞傷羊石子羊外腎也甘溫功同內腎而更優治下部虛寒遺精淋帶癥瘕疝氣房勞內傷陽萎陰寒諸般隱疾並宜煨爛或熬粥食亦可入藥用下部火盛者忌之羊脬甘溫補脬損攝下焦之氣凡虛人或産後患遺溺者宜之羊胃俗名羊肚甘溫補胃益氣生肌解渴耐飢行水止汗羊腸甘溫補氣健步固精行水厚腸便溺有節故董香光祕傳藥酒方以之為君也捶熟為線堅韌絶倫補力之優於此可見牛肉章杏云云牛為稼穡之資天子無故不忍宰祭祀非天神不敢歆豈可妄殺乎及觀莊子犧牛耕牛之喻知古人宰殺者惟犧牛而耕牛必不殺也袁存齋云天生萬物大概以有用於人為貴律文宰牛馬有禁宰羊豕無禁所以然者羊豕無用於人而牛馬有用於人也按此二説皆通儒之論余家世不食牛奉祖訓而守禮法非有惑於福利之説也故不譜其性味中其毒者杏仁蘆根汁稻杆煎濃汁人乳並可解之汪謝城曰牛肉亦有可食者其祭祀之胙乎每見不食牛者以此胙賜與儓不免褻越余有一法以此牛供祭之後用合霞天膠黃明膠諸藥不褻神余又治民病最為兩得馬肉辛苦冷有毒食杏仁或飲蘆根汁解之其肝食之殺人驢肉酸平有毒動風反荊芥犯之殺人騾肉辛苦溫有毒孕婦食之難産野豬肉甘平補五臟潤肌膚治顛癇腸風痔血禁忌與豬肉同蹄爪補力更勝一切癰疽不斂多年漏瘡煨食即愈其脂臘月煉過收藏和酒服令婦人多乳服十日後可給三四兒素無乳者亦下亦可塗腫毒疥癬豪豬肉一名箭豬甘寒有毒多膏滑腸能發風虛不可多食虎肉酸鹹溫作土氣味不佳宜醃食補脾胃益氣力止多唾善嘔闢精魅鬼瘧入山則虎見畏之其脂治反胃塗白禿凍瘡痔瘡狗咬瘡豹肉酸溫安五臟補絶傷御風寒闢鬼魅壯筋骨強健人熊肉甘溫補虛損殺勞蟲治風痹筋骨不仁有錮疾者忌食其蹯俗呼熊掌益氣力御風寒極難胹須用石灰沸湯剝盡以酒醋水三件同封固微火煮一晝夜大如皮球白肉紅絲色味豔美其背上脂惟冬月有之名熊白功與肉同味更美其膽入藥治疔疽去翳息驚為珍品象肉甘平不益人多食則體重煮汁飲通小便煅灰服治溺多和油傅愈禿瘡其皮生肌為瘡家收功藥又治金瘡不合塗下疳並煅灰用其牙治風癇驚悸內熱骨蒸諸物鯁喉通小便療諸瘡久痔闢一切邪魅精物並以生屑調服外傅針刺諸物入肉羚羊肉甘平治筋骨急強中風愈惡瘡免蛇蟲傷山羊肉野羊也甘熱治冷勞赤白帶下利産婦闢嵐瘴理筋骨急強時病人忌之其血破瘀生新療跌打諸傷筋骨疼痛吐衄瘀停諸病鹿肉甘溫補虛弱益氣力強筋骨調血脈治産後風虛辟邪麋肉同功但宜冬月炙食諸外感病忌之其茸角鞭血皆主溫補下元惟虛寒之體宜之若陰虛火動者服之貽誤匪淺全鹿丸尤不可信葉天士嘗闢之不可不知也中風口眼喎斜生鹿肉同生椒搗貼正即去之麂肉甘平補氣暖胃耐飢化濕祛風能瘳五痔痞滿氣滯者勿食獐肉一名麕甘溫祛風補五臟長力悅容顏按食療云八月至十一月食之味美勝羊十二月至七月食之動氣多食發錮疾患消渴貍肉甘平補中益氣治諸疰去遊風療溫鬼毒氣皮中如針刺愈腸風下血及痔瘻如神貍類甚多惟南方有白麵而尾似牛者名牛尾貍亦曰玉面貍專上樹木食百果俗呼果子貍冬月極肥美亦可糟食內則食貍去正脊若捕而畜之鼠皆帖服不敢出別種皆不堪食貒肉一名豬獾甘溫補羸瘦長肌下氣平咳逆勞熱水脹久痢煮食即瘳野獸中佳品也獾肉一名狗獾功與貒相似兼能殺蛔蟲黃瘦疳膨食之自愈狼肉鹹溫補五臟御風寒暖胃厚腸壯陽填髓其脂潤燥治諸惡瘡內則食狼去腸腹有冷積者最宜陰虛內熱人忌食狼肥豺瘦諺云體瘦如豺故豺肉不堪食也食療云食豺令人瘦兔肉甘冷涼血祛濕療瘡解熱毒利大腸多食損元陽令人痿黃冬至後至秋分食之傷人神氣孕婦及陽虛者尤忌兔死而眼合者誤食殺人水獺肉甘鹹涼清血熱理骨蒸下水通經祛毒風利大小便多食消男子陽氣其肝性熱闢蠱殺蟲補産虛已勞嗽治傳尸鬼疰魚骨鯁喉瘧久不瘳心腹積聚腸痔下血寒疝攻疼其爪搔喉亦治骨鯁蝟肉俗名刺鼠甘平下氣殺蟲治反胃痔漏按食此必去骨淨盡誤食令人瘦劣其皮煅研服治遺精甚效雞甘溫補虛暖胃強筋骨續絶傷活血調經拓癰疽止崩帶節小便頻數主娩後虛羸以騸過細皮肥大而嫩者勝肥大雌雞亦良若老雌雞熬汁最佳烏骨雞滋補功優多食生熱動風凡時感前後痘疹後瘡瘍後瘧痢疳疸肝氣目疾喉證腳氣諸風病皆忌之未騸者愈老愈毒諸病均不可食惟辟邪宜用丹雄雞也中惡昏憒丹雄雞一隻安放病者心間以雞頭向病人之面雞伏而不動待其飛下病者亦蘇雞冠血老雄雞者力勝治無故卒死或寢臥奄忽而絶皆是中惡刺取雞冠血塗面上干則再上並滴入口鼻中卒縊垂死心中猶溫者勿斷繩刺雞冠血滴口中卒然杵死不能言刺雞冠血和真珠末丸小豆大納三丸入口中小兒卒驚似有痛處不知疾狀亦刺血滴口中鬼擊卒死刺雞冠血瀝口中令咽仍彼此雞拓心下冷乃棄之道旁女人交接違禮血出刺雞冠血頻塗對口發背諸毒刺雞冠血滴疽上血盡再換不過五六雞痛止毒散淫浸瘡不早治殺人宜刺雞冠血塗日四五次蜈蚣蜘蛛咬馬咬成瘡燥癬作癢並刺雞冠血塗中蜈蚣毒舌脹出口者是也刺雞冠血浸舌並咽之諸蟲入耳雞冠血滴耳中雞膍胵一名雞內金治喉痹雞內金勿洗陰乾煅末竹管吹之一切口瘡雞內金煅灰傅鵝口白雞內金為末乳服五分走馬牙疳雞內金不落水者五枚枯礬五錢共研搽小兒疣目雞內金擦之自落小兒瘧疾雞內金煅存性乳服男用雌女用雄噤口痢雞內金焙研乳汁服反胃雞內金一具煅存性研酒下男用雌女用雄發背初起雞內金不落水者陰乾用時溫水潤開貼之隨干隨潤以愈為度發背已潰雞內金同棉絮焙末擦瘡口不合雞內金日貼之陰頭疳蝕雞內金不落水拭淨新瓦焙脆出火毒研細先以米泔洗淨擦之亦治口疳穀道生瘡雞內金燒存性研末傅雞腸治遺濁淋帶消渴遺溺小便不禁或頻數無火者並可炙食雞卵一名雞子亦曰雞蛋甘平補血安胎鎮心清熱開音止渴濡燥除煩解毒息風潤下止逆新下者良並宜打散以白湯或米飲或豆腐漿攪熟服若囫圇煮食性極難熟雖可果腹甚不易消惟帶殼略煮之後將殼擊碎再入瓷罐內多加粗茶葉同煨三日茶汁既入蛋亦熟透剝殼食之色黑而味香美不甚閉滯也多食動風阻氣諸外感及瘧疸疳痞腫滿肝鬱痰飲腳氣痘疹皆不可食小兒産婦氣壯者幸食無恙弱者多因此生疾不可不知解野葛毒雖已死者抉開口灌生雞子三枚須臾吐出胎動下血雞子二枚打散粥湯攪熟服産後血暈身痙直口目向上不知人雞子清一枚調荊芥末二錢灌之妊娠下血不止血盡則子死名曰胎漏雞子黃十四枚以好酒二升煮如餳服未止再服鳳凰胎即雞卵抱已成雛而未出者用為傷科長骨之藥甚妙其殼名鳳凰衣煅存性研服治勞復及小便不通暨飲停脘痛外治痘瘡入目白禿聤耳下疳囊癰均為妙品鵝甘溫暖胃升津性與葛根相似能解鉛毒故造銀粉者月必一食也鮮美補虛益氣味較雞鶩為濃動風發瘡凡有微恙者其可嘗試乎肥嫩者佳烤食尤美其肫其掌性較和平煨食補虛宜於病後其卵補中滯氣更甚於雞其血解一切金石毒熱飲即瘥其毛於銅鍋內炒焦研末豆腐皮包酒吞服三錢能內消諸般腫毒鴨本名鶩一名舒鳧甘涼滋五臟之陰清虛勞之熱補血行水養胃生津止嗽息驚消螺螄積雄而肥大極老者良同火腿海參煨食補力尤勝多食滯氣滑腸凡陽虛脾弱外感未清痞脹腳氣便瀉腸風皆忌之其血熱飲救中惡溺死及服金銀丹石砒霜野葛鴉片諸蠱毒入咽即活並塗蚯蚓咬瘡其卵夜下純陰性寒難熟滯氣甚於雞子諸病皆不可食惟醃透者煮食可口且能愈瀉痢更有造為皮蛋糟蛋者味雖香美皆非病人所宜雉一名野雞甘溫補中益氣止泄痢除蟻瘻冬月無毒多食損人發痔諸病人忌之勿與荍麥胡桃木耳菌菌同食春夏秋皆毒以其善食蟲蟻而與蛇交也又諸鳥自死者皆有毒勿食鷓鴣甘溫利五臟開胃益心神解野葛菌菌生金蠱毒南方之鳥也飛必南翔集必南首故一名懷南性屬火多食發腦痛喉癰蓋天産作陽本乎天者親上飛禽之性無不升發於鷓鴣何尤竹雞甘平解野雞山菌毒殺腹內諸蟲鶉甘平和胃消結熱利水化濕止疳痢除膨脹愈久瀉鷃一作鵪甘平清熱療陰𧈟諸瘡鷸與翡翠同名異物甘溫暖胃補虛鴿甘平清熱解毒愈瘡止渴息風孕婦忌食卵能稀痘食品珍之雀甘溫壯陽暖腰膝縮小便已崩帶但宜冬月食之陰虛內熱及孕婦忌食其卵利經脈調衝任治女子血枯崩帶疝瘕諸病燕窩甘平養胃液滋肺陰潤燥澤枯生津益血止虛嗽虛痢理虛膈虛痰病後諸虛尤為妙品力薄性緩久任斯優病邪方熾勿投其根較能下達鷦鷯一名巧婦俗呼黃脰雀甘溫暖胃斑鳩甘平養老和中令人不噎鳲鳩即布穀甘溫定志安神令人少睡桑鳸一名臘嘴雀甘溫補胃鶯詩云黃鳥左傳曰青鳥爾雅名商庚説文謂黃鵬月令作倉庚甘溫舒郁和肝令人不妒鴷啄木鳥也甘平開膈利噎平驚追勞蟲已痔漏牙疳齒齲煅末塞之鴇甘平補虛已風痹病鳧野鴨也甘涼補脾腎祛風濕行水消腫殺蟲清熱開胃運食療諸瘡癇病後虛人食之有益肥而其喙如鴨者良冬月為勝鸊鷉一名刁鴨一名油鴨甘平補中開胃雁甘平解毒祛風多食動氣君子勿食以其知陰陽之升降少長之行序也道家為之天厭鵠一名天鵝甘平醃炙食之利臟腑鷺即鷺鷥咸涼炙熟食解魚蝦毒其卵似鴨卵稍鋭而色較青土人混入鴨卵中售之氣腥而冷更不宜人梟亦作梟俗呼貓頭鳥甘溫補虛勞殺蟲闢鬼魅開胃消食利噎平驚治痁瘧顛癇愈惡瘡鼠瘻炙食味美古人所珍莊子見彈而求梟炙是也病後及衰弱勞瘵人最宜惟孕婦忌之鱗介類附蠶蛹寫螽鯉魚甘溫下氣功專行水通乳利小便滌飲止咳嗽治妊娠子腫敷癰腫骨疽可鮮可脯多食熱中熱則生風變生諸病蓋諸魚在水無一息之停發風動疾不獨鯉也以鯉脊上有兩筋故能神變而飛越江湖為諸魚之長品雖拔萃性不益人杭俗以其為聖子之諱相戒勿食最通其兩筋及黑血皆有毒天行病後及有宿癥者均忌醉者尤甚曩余遊婺見烹此者必先抽去其筋而他處不知也甚以醉鯉為病人珍味豈不誤人鱮魚一名鰱魚甘溫暖胃補氣澤膚其腹最腴烹鮮極美肥大者勝醃食亦佳多食熱中動風發疥痘疹瘧痢目疾瘡家皆忌之鱅魚亦作溶魚一名鱃魚俗呼包頭魚以其頭大也甘溫蓋魚之庸常以供饈食者故命名如此其頭最美以大而色較白者良鯇魚音混俗作鱔非甘溫暖胃和中俗名草魚因其食草也婺州云間以其色青也誤以青魚呼之禾人名曰池魚尤屬可笑夫池中所蓄之魚豈獨鯇而已哉青魚甘平補氣養胃除煩悶化濕祛風治腳氣腳弱可鱠可脯可醉古人所謂五候鯖即此其頭尾烹鮮極美腸臟亦肥鮮可口而鬆江人呼為烏青金華人呼為烏鯔杭人以其善啖螺也因呼為螺螄青其膽臘月收取陰乾治喉痹目障惡瘡魚骨鯁皆妙上五種皆購秧而蓄之故無子惟鯉魚則溪河亦有故間有有子者膾以諸魚之鮮活者劊切而成青魚最勝一名魚生沃以麻油椒料味甚鮮美開胃析酲按食治云凡殺物命既虧仁愛且肉未停冷動性猶存烹飪不熟食猶害人況魚膾肉生損人尤甚為癥瘕為錮疾為奇病不可不知昔有食魚生而成病者用藥下出已變魚形膾縷尚存有食鱉成積者用藥下出已成動物而能行可不戒哉鮓以鹽糝醞釀而成俗所謂糟魚醉鯗是也惟青魚為最美補胃醒脾溫營化食但既經糟醉皆能發疥動風諸病人均忌鱒魚一名赤眼魚甘溫補胃暖中多食動風生熱鯔魚甘平補五臟開胃肥健人與百藥無忌湖池所産無土氣者良腹中有肉結俗呼算盤子與腸臟皆肥美可口子亦鮮嫩異於他魚江河産者遜之但宜為臘白魚一名鱎魚甘溫開胃下氣行水助脾發痘排膿可醃可鮓多食發疥動氣生痰鱤魚即鰥魚一名黃頰魚甘溫暖胃與鱒略同石首魚一名黃魚亦名江魚甘溫開胃補氣填精以大而色黃如金者佳多食發瘡助熱病人忌之醃而臘之為白鯗性即和平與病無忌且能消瓜成水愈腹脹瀉痢以之煨肉味甚美太平所産中伏時一日曬成尾彎色亮味淡而香者最良名松門臺鯗密收勿受風濕可以久藏煮食開胃醒脾補虛活血為病人産後食養之珍按古以乾魚為鮑魚禮記謂之粟諸魚皆可為之內經治血枯有之後人聚訟紛紛迄無定指愚謂臺鯗雖生嚼不腥性兼通補入藥宜用此為是其鰾甚薄不為珍品但可熬膠耳鮸魚形似石首魚而大其頭較鋭其鱗較細鮮食味遜但宜為臘正字通以為即石首魚者誤也鮸本音免今人讀如米其鰾較石首魚者大且厚干之以為海錯産南洋者佳古人名為鱁鮧煨爛食之補氣填精止遺帶大益虛損外感未清痰飲內盛者勿食以其膩滯也又治諸血證療破傷風如神勒魚甘平開胃暖臟補虛大而産南洋者良鮮食宜雄其白甚美雌者宜鯗隔歲尤佳多食發風醉者更甚鯧魚亦作鯧甘平補胃益血充精骨軟肉腴別饒風味小而雄者勝可脯可鮓多食發疥動風鰣魚甘溫開胃潤臟補虛其美在鱗臨食始去厥味甚旨可蒸可糟諸病忌之能發錮疾鱗可為鈿亦可拔疔鮆魚亦作鱭甘溫補氣肥大者佳味美而腴亦可作鮓多食發瘡助火以溫州所産有子者佳干以為臘用充方物味甚鮮美古人所謂子魚是也大者尤勝食品珍之與病無忌鱸魚甘溫微毒開胃安胎補腎舒肝可脯可鮓多食發瘡患癖其肝尤毒剝人面皮中其毒者蘆根汁解之鯽魚其美在脊也俗作鯽魚一名鮒魚甘平開胃調氣生津運食和營息風清熱殺蟲解毒散腫愈瘡止痢止疼消疳消痔大而雄者勝宜蒸煮食之外感邪盛時勿食嫌其補也余無所忌煎食則動火痔血鯽魚常作羹食酒積下血酒煮鯽魚常食浸淫瘡生鯽魚切片鹽搗貼頻易魴魚一名鯿魚甘平補胃養脾去風運食功用與鯽相似産活水中肥大者勝鱖魚一名鯚魚甘平益脾胃養血補虛勞殺勞蟲消惡血運飲食肥健人過大者能食蛇故有毒而發病䱂魚一名渡父魚俗呼土鮒亦曰菜花魚甘溫暖胃運食補虛春日甚肥與病無忌鰷魚一名白條小者名𩽐條甘溫暖胃助火發瘡諸病人勿食銀魚一名鱠殘魚甘平養胃陰和經脈小者勝可作干蠡魚一名黑鱧亦名烏鱧亦曰黑魚即七星魚甘寒行水化濕祛風稀痘愈瘡下大腹水腫腳氣通腸療痔主妊娠有水膚浮病後可食之道家以為水厭稀痘除夕黃昏用大黑魚一尾煮湯浴小兒七竅俱到不可嫌腥以清水洗去也甚驗水氣垂死腸痔下血黑魚一斤重者煮汁和冬瓜蔥白作羹食偏正頭風陳黑魚頭煎湯熏數次斷根鱘魚甘溫補胃活血通淋多食發疥患癥味佳而性偏劣作鮓亦無補益鼻脯味美療虛子主殺蟲味亦肥美鰉魚亦作黃本名鱣一名蠟魚亦名玉版魚甘溫補虛令人肥健多食難化發疥生痰作鮓極珍亦勿多食反荊芥其肚及子鹽藏頗佳其脊骨腮鼻唇鬐皆肥美脆軟以充珍錯其鰾最良固精止帶鮠魚亦作麗龷比回一名白草力甘溫行水調中多食能動錮疾鮫魚即沙魚甘平補五臟作鮓甚益人其皮亦良解諸魚毒殺蟲闢蠱愈傳尸勞煨肉味佳滋陰補血鬣翅以清補勝煨糜甚利虛勞烏鰂亦作烏賊一名墨魚鹹平療口咸滋肝腎補血脈理奇經愈崩淋利胎産調經帶療疝瘕最益婦人可鮮可脯南洋所産淡乾者佳骨名海螵蛸入藥功相似卒然吐血小兒痰齁並以海螵蛸末二錢米飲下跌打出血海螵蛸末傅比目魚本名鰈一名箬魚甘平補虛多食動氣鮎魚甘溫微毒利小便療水腫痔血肛痛不宜多食余病悉忌反荊芥口眼喎斜者活切其尾尖朝吻貼之黃顙魚俗呼黃刺魚甘溫微毒行水祛風發痘瘡反荊芥河豚魚一名西施乳甘溫補虛去濕療痔殺蟲反荊芥菊花桔梗甘草附子烏頭中其毒者橄欖青蔗蘆根金汁或槐花微炒同干胭脂等分搗粉水調灌之其肝子與血尤毒或云去此三物洗之極淨食之無害然衛生者何必涉險以試耶帶魚甘溫暖胃補虛澤膚産南洋而肥大者良發疥動風病人忌食作鯗較勝冬醃者佳鱝魚一名荷魚俗呼鍋蓋魚甘鹹平尾有毒主玉莖澀痛白濁膏淋性不益人亦可作鯗海虴一名樗蒲魚即水母也鹹平清熱消痰行痰化積殺蟲止痛開胃潤腸治哮喘疳黃癥瘕瀉痢崩中帶濁丹毒顛癇痞脹腳氣等病諸無所忌陳久愈佳蝦甘溫微毒通督壯陽吐風痰下乳汁補胃氣拓痘瘡消癥瘕傅丹毒多食發風動疾生食尤甚病人忌之海蝦性味相同大小不一産東洋者尤佳鹽漬暴乾乃不發病名式甚夥厥味皆鮮開胃化痰病人可食其子可醃可暴味亦鮮美海參鹹溫滋腎補血健陽潤燥調經養胎利産凡産虛病後衰老尪孱宜同火腿或豬羊肉煨食之種類頗多以肥大肉厚而糯者膏多力勝脾弱不運痰多便滑客邪未盡者均不可食蟾蜍甘苦涼清熱殺蟲消疳化毒平驚散癖行濕除黃止痢療溫愈諸惡瘡及猘犬咬凡小兒瘡家疫病並宜食之其肝尤良其眉間白汁有大毒名蟾酥為外科要藥發背腫毒初起取活蟾蜍一隻系放瘡上半日蟾必昏憒置水中救其命再易一隻如前法蟾必踉蹌再易一隻必俟蟾如故則毒散矣田雞一名水雞甘寒清熱行水殺蟲解毒愈瘡消疳已痔多食助濕生熱且肖人形而殺之甚慘孕婦最忌其骨食之患淋鰻鱺甘溫補虛損殺勞蟲療癘瘍瘻瘡祛風濕湖池産者勝肥大為佳蒸食頗益人亦可和麵苗亦甚美名曰鰻線然其形似蛇故功用相近多食助熱發病孕婦及時病忌之且其性善鑽能入死人死畜腹中唼其膏血不但水行昂首白點黑斑四目無腮尾扁過大者始為毒物也尊生者慎之産海中者形大性同名狗頭鰻多醃為臘瘡痔家宜食之余病並忌鱓俗作鱔亦呼鱔魚甘熱補虛助力善去風寒濕痹通血脈利筋骨治産後虛羸愈臁瘡痔瘻肥大腹黃者勝宜與豬脂同煨多食動風發疥患霍亂損人時病前後瘧疸脹滿諸病均大忌黑者有毒更有蛇變者項下有白點夜以火照之則通身浮水上或過大者皆有毒不可不慎也其血塗口眼喎斜赤遊風滴鼻止衄滴目治疹後生翳鰌俗名泥鰍甘平暖胃壯陽殺蟲收痔耕牛羸瘦以一條送入鼻中立愈蚺蛇甘溫治諸瘡癘闢蠱殺蟲化毒祛風除疳御瘴療猘犬咬味美勝雞燒酒浸之歷久不壞膽為傷科聖藥腹內之油縮陽雄蛇之如意鉤又為房術妙品白花蛇甘鹹溫祛風濕治半身不遂口面喎斜風癘癧瘍骨節疼痛痘瘡倒陷搐搦驚癇麻痹不仁黴瘡疥癬頭尾甚毒去盡用之産蘄州者良雖乾枯而目光不陷故一名蘄蛇凡飲蛇酒切忌見風烏蛇甘平治諸風頑痹皮膚不仁熱毒癩瘡眉髭脫落功並白蛇性善無毒朝野僉載商州有人患大風家人惡之為起茅屋有烏蛇墮酒罌時病人不知飲酒漸瘥罌底見有蛇骨始知其由一法以大烏蛇三條蒸熟取肉焙末蒸餅丸米粒大以喂烏雞待盡殺雞烹熟取肉焙研末酒服一錢或蒸餅丸服不過三五雞愈一法用大烏蛇一條打死盛之待爛以水二碗浸七日去皮骨入糙米一升浸一日曬乾用白雞一隻餓一日以米飼之待毛羽脫盡殺而煮食以酒下之吃盡用熱湯一盆浸洗大半日即愈或謂君以限於篇幅雖穀肉果菜未及遍搜顧因鰻鱓而類及於蛇豈以其形相若耶然毒物惡可以供饌也余曰子但知蛇之毒不可以供食而不知臘之以為餌可已大風攣踠瘻癘去死肌殺三蟲更有烏蛇之性善無毒誤飲其酒者大風遂愈此非常之士能立非常之功也彼鰻鱓者世以為尋常食品竟有食之即死者此庸碌之人往往僨事也類而譜之可為任才者循名不責實之鑑豈徒為飲食之人費筆墨哉龜四靈之一變化神通本非食品亦與蛇匹有殺之而得禍者有食之而即死者書家所載甚多茲不具贅不但為孕婦所忌也其殼入藥但可煎熬末而服之能還本質鱉一名團魚亦曰甲魚甘平滋肝腎之陰清虛勞之熱主脫肛崩帶瘰癧癥瘕以湖池所産背黑而光澤重約斤許者良宜蒸煮食之或但飲其汁則益人多食滯脾且鱉之陽聚於上甲久嗜令人患發背孕婦及中虛寒濕內盛時邪未盡者切忌之又忌與莧同食回回不食鱓鱉謂之無鱗魚凡鱉之三足者赤腹者赤足者獨目者頭足不縮者其目四陷者腹下有王字卜字紋者過大者在山上者有蛇紋者並有毒殺人或云薄荷煮鱉亦害人其殼入藥亦不可作丸散服人咬指爛久而欲脫及陰頭生瘡諸藥不愈者鱉甲煅存性研雞子清調傅黿甘平有毒難死通靈異味損人勿輕染指蟹甘鹹寒補骨髓利肢節續絶傷滋肝陰充胃液養筋活血治疽愈痎療跌打骨折筋斷諸傷解鱔魚莨菪漆毒殼主辟邪破血爪可催産墮胎種類甚繁名號不一以吳江烏程秀水嘉興海昌等處河中所産霜後大而脂滿者勝和以薑醋風味絶倫多食發風積冷孕婦及中氣虛寒時感未清痰嗽便瀉者均忌別種更寒尤不益人中其毒者紫蘇冬瓜蘆根蒜汁皆可解之反荊芥又忌同柿食誤犯則腹痛吐利急以丁香木香解之海産者黃堅滿而無膏不鮮並可鹽漬酒浸糟醬久藏得皂莢則不沙鱟辛鹹平殺蟲療痔多食發嗽及癬瘡腋以為鮓俗呼鱟醬蠣黃甘平補五臟調中解丹毒析酲止渴活血充肌味極鮮腴海錯珍品周亮工比為太真乳殼名牡蠣入藥蚌甘鹹寒清熱滋陰養肝涼血息風解酒明目定狂崩帶痔瘡並堪煨食大者為勝多食寒中外感未清脾虛便滑者皆忌之蜆甘鹹寒清濕熱治目黃溺澀腳氣洗疔毒痘癰諸瘡殼黃而薄者佳多食發嗽積冷蛤蜊甘鹹寒清熱解酒止消渴化癖除癥多食助濕生熱蟶甘平清胃治痢除煩補産後虛解丹石毒可鮮可臘時病忌之蚶甘溫補血潤臟生津健胃暖腰息風解毒治泄痢膿血痿痹不仁産奉化者佳可炙可鮓多食壅氣濕熱盛者忌之殼名瓦楞子入藥滌飲消癖破血止疼傅牙疳皆有效鰒魚甘鹹溫補肝腎益精明目開胃養營已帶濁崩淋愈骨蒸勞極體堅難化脾弱者飲汁為宜殼入藥名石決明主鎮肝磨障淡菜甘溫補腎益血填精治遺帶崩淋房勞産怯吐血久痢膝軟腰疼痃癖癥瘕臟寒腹痛陽萎陰冷消渴癭瘤干即可以咀食味美不腥産四明者肉厚味重而鮮大者彌勝江瑤柱甘溫補腎與淡菜同鮮脆勝之為海味冠乾者咀食味美不腥嬌嫩異常味重易化周棟園比之梅妃骨其殼如淡菜上鋭下平大者長尺許肉白而韌不中食美惟在柱也瀕湖以為海月者謬已璅𤥐甘平開胃滋液補虛化濁升清聰耳明目按璅𤥐狀似珠蚌殼青黑色長寸許大者二三寸生白沙中不汙泥淖乃物之最潔者也有兩肉柱能長短又有數白蟹子在腹中狀如榆莢合體共生常從其口出為之取食然璅𤥐清潔不食但寄其腹於蟹蟹為璅𤥐而食食在蟹而飽在璅𤥐故一名共命螺又名月蛄每冬大雪則肥瑩如玉日映如雲母為海錯之至珍至海鏡即海月也一名石鏡亦名蠣鏡又呼膏藥盤土人磨其殼以為明瓦者一殼相合甚圓肉亦瑩潔有紅蟹子居其腹為取食名曰蚌奴與在璅𤥐腹者白蟹子各不同也西施舌甘平開胃滋液養心清熱息風涼肝明目海錯美品得此嘉名實即車蛤也海螺甘冷明目治心腹熱痛靨名甲香主管領諸香田螺甘寒清熱通水利腸療目赤黃疸腳氣痔瘡多食寒中脾虛者忌性能澄濁宜蓄水缸小便不通腹脹如鼓大田螺鹽半匕生搗敷臍下一寸三分亦治水氣浮腫同大蒜車前搗貼噤口痢大田螺二枚杵爛入麝香三分作餅烘熱貼臍間半日即思食矣腳氣上衝大田螺杵爛傅兩腿上疔毒痔瘡田螺入冰片化水點之螺螄甘寒清熱功遜田螺過清明不可食海螄咸涼舒郁散結熱消瘰癧吐鐵鹹寒補胃明目析酲以大而肉嫩無泥拖脂如凝膏大如本身者佳産南洋醃者味勝更以蔥酒醉食味益佳蠶蛹甘溫補氣止渴殺蟲治疳積童勞助痘漿乳汁繅絲後濾干曬焙極燥可以久藏氣香最引蜈蚣故須密收炙食味佳患腳氣者忌之猘犬咬者終身勿犯誤食必難免也蛗螽蛗從阜言其生息之繁螽從冬言其子能歷冬不死必得大雪則入土也種類不一形狀稍殊春秋書之以其害稼實即蝗之屬也若旱年水涸魚蝦諸子悉化蛗螽之類而食禾人始稱為蝗矣故平時之蛗螽旱歲之蝗北人皆炙而食之辛甘溫暖胃助陽健脾運食餵豬最易肥腯按捕蝗雖有法必得大雨而始息者蝗得水而復可為魚蝦也嗚呼猶之民失教以為盜賊誅之必不勝誅得有善教者何難復化為民耶譜飲食以水始以蝗終讀是書者毋使民之失教如魚蝦之失水則蝗飛何至蔽天庶不徒為飲食之人矣吾師嘗自書楹帖云近人情之謂真學問知書味即是活神仙開第謂讀書破萬卷者多識此十六字者鮮必識此十六字方許讀是書跋昔汪信民先生曰人嘗咬得菜根則百事可做噫豈為咬菜根者言耶國朝湯文正公撫吳時日給惟薺韭其公子偶市一雞公知之立召公子跪庭下責之曰惡有士不嚼菜根而能作百事者哉即遣去奈何世之肉食者流竭人脂膏供其口腹豢其妻孥以為分所應爾及當天下事則碌碌無所措暴殄天物莫此為甚飲不思源則為忘本此夢隱飲食譜之所由作也夢隱名重三江傳食諸候數十年會世有亂徵歸處窮鄉布素自甘粹然儒士門以內不佞佛亦不殺生蓋儉以養廉淡以寡欲安貧之道於是卻疾之方於是而其立身養生之有素者慨然欲與世共而譜是書書先水穀水食之精也谷食之本也調和為制宜之具也蔬果亦日用之常也故曰飲曰食而考之實辨之詳毛羽鱗介不言食以非人人可常食也至穀食以番薯終救荒之功也至蔬食以菽乳終薄海之常饌也義例謹嚴意寓懲戒美不勝書書所管見者蘇文忠公云屠殺牛羊刳臠魚鱉以為膳羞食者甚甘死者甚苦故無故不殺聞聲不食古聖賢於斯三致意焉則是書之微意實通古今而酌其宜豈若愚人佞佛持戒殺之説而終不可行者耶且夢隱嘗處膏脂而不潤今食粳㖨而充然蓋無人而不自得也是編之纂直胥天下後世而飲食之教誨之顧可以養生卻病一端視之哉余敢述其微以告夫世之肉食者咸豐辛酉仲冬秀水董耀枯匏跋春秋戰爭七十國而顏淵原憲之徒以陋巷終者其時天下尚能容隱君子也夫隱君子者或高尚其事而隱或功成身退而隱或時不可為而隱或不堪從政而隱類皆有地以容其隱者也否則托迹於農工樵賈緇黃末伎之流以自食其力而隱其途雖殊其歸則同更或力不能為農工樵賈緇黃末伎者如留侯鄴侯之隱於白雲鄉劉阮陶李之隱於醉鄉司馬長卿以溫柔鄉隱希夷先生以睡鄉隱尤為隱中之尤著者也吾友海昌王君抱有用之才無功名之志操活人之術而隱於布衣此海豐張雨農司馬以為奇人而吾鄉莊芝階中翰稱曰隱君子也余謂惟奇人斯能隱王君身雖隱而名望日隆邀遊公卿數十年知劫運釀成莫從挽救飄然歸籍貧無立錐嘗著歸硯録以見志乃不數年而遍地荊榛硯田蕪穢癡無所用身亦難潛君號半癡而顏其室曰潛齋今夏挈眷來此米珠薪桂並日而食因纂飲食譜以攄懷易字曰夢隱噫顧仁術猶不能容於擾攘之世而欲追步希夷隱於睡鄉以待承平之日哉是譜以水始以蝗終寓意深矣夢隱身嘗世味如辨淄澠豈治亂之理果可徵之人事歟初省垣以重兵自衛縻餉年餘秋杪被圍至六十餘日升米三千斤蔬七百草根掘盡餓斃者以數萬計卒以兵潰城陷死於鋒鏑及自殉者亦以萬計其被虜與流轉而死者又不可以數計千古名城遂無噍類蝗飛蔽天之禍竟至是耶嗚呼慘矣韓子云食焉而怠其事必有天殃殃之及也生民塗炭可不痛哉是書言近而旨遠吾願後之覽者無負其苦心焉爰抒聞見跋諸卷尾咸豐辛酉嘉平秀水呂大綱慎庵
